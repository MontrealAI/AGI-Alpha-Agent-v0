<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Sovereign Workbench</title><desc id="desc">A private mandate advances through portfolio, schedule and evidence reviews.</desc><rect width="1200" height="630" fill="#100b1a"/><circle cx="1050" cy="140" r="180" fill="#21162f"/><circle cx="1050" cy="140" r="130" fill="none" stroke="#8062ac"/><text x="65" y="80" fill="#bba0ff" font-family="sans-serif" font-size="18" letter-spacing="4">ALPHA FACTORY / SOVEREIGN</text><text x="65" y="195" fill="#f5f0ff" font-family="Georgia,serif" font-size="72">Authority follows</text><text x="65" y="275" fill="#bba0ff" font-family="Georgia,serif" font-style="italic" font-size="76">evidence.</text><text x="65" y="330" fill="#bdb0d1" font-family="sans-serif" font-size="22">One bounded mandate. Three explicit reviews. Signed results.</text><g fill="#1b1429" stroke="#8062ac"><rect x="65" y="395" width="335" height="150" rx="16"/><rect x="425" y="395" width="335" height="150" rx="16"/><rect x="785" y="395" width="335" height="150" rx="16"/></g><g fill="#bba0ff" font-family="sans-serif" font-size="16"><text x="90" y="435">01 / PORTFOLIO</text><text x="450" y="435">02 / SCHEDULE</text><text x="810" y="435">03 / EVIDENCE</text></g><g fill="#f5f0ff" font-family="Georgia,serif" font-size="26"><text x="90" y="480">Choose feasible work</text><text x="450" y="480">Resolve shared capacity</text><text x="810" y="480">Explain the decision</text></g><g fill="#bdb0d1" font-family="sans-serif" font-size="16"><text x="90" y="520">Budget + risk + assumptions</text><text x="450" y="520">Verified operation constraints</text><text x="810" y="520">Source-bound signed packet</text></g><text x="65" y="595" fill="#e3c18a" font-family="sans-serif" font-size="16">PRIVATE OPERATOR WORKSPACE · PUBLIC RECORDED EVIDENCE</text></svg>