   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5a31a0" x="22.338" y="76.576169" transform="rotate(-0 22.338 76.576169)">Permitted inheritance</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 96.609019)">Executable strategy and declared scope</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 109.008175)">Source and parent digests</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 121.407331)">Historical observations and counterexamples</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 133.806487)">Retention history</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007a78" x="301.338" y="76.5332" transform="rotate(-0 301.338 76.5332)">Current mission boundary</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(301.338 96.609019)">WORLD: fresh jobs, calendar, deadline and locks</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(301.338 109.008175)">POLICY: exact applicable candidate</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(301.338 121.407331)">PROOF and AUTHORITY start empty</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a17e2c" x="301.338" y="204.642569" transform="rotate(-0 301.338 204.642569)">External to candidate search</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(301.338 224.675419)">Fixed checker + budget + source binding</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(301.338 237.074575)">Current scoped permission, expiry and STOP</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6577" transform="translate(16.2 206.433694)">Imported success is historical evidence.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6577" transform="translate(16.2 219.911037)">It cannot authorize a new action or</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #5d6577" transform="translate(16.2 233.388381)">substitute for a new result check.</text>
