   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1c2536" x="10.62" y="16.128" transform="rotate(-0 10.62 16.128)">Recover an accepted result; charge uncertain work</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5a31a0" x="22.338" y="75.157713" transform="rotate(-0 22.338 75.157713)">1  Durable intent</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 95.190563)">Reserve bounded execution</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 107.589719)">Record source and request ID</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007a78" x="216.522" y="75.157713" transform="rotate(-0 216.522 75.157713)">2  Execute + check</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(216.522 95.190563)">Fresh independent acceptance</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(216.522 107.589719)">Save a ready result</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5a31a0" x="410.148" y="75.157713" transform="rotate(-0 410.148 75.157713)">3  Commit receipt</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(410.148 95.190563)">Advance cursor once</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(410.148 107.589719)">Preserve cumulative cost</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a17e2c" x="22.338" y="177.721713" transform="rotate(-0 22.338 177.721713)">Interrupted intent</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 197.754563)">Charge reserved ceiling</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(22.338 210.153719)">Re-execution may be needed</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007a78" x="216.522" y="177.678744" transform="rotate(-0 216.522 177.678744)">Lost acknowledgement</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(216.522 197.754563)">Recheck saved result</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(216.522 210.153719)">Avoid duplicate acceptance</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a64e61" x="410.148" y="177.721713" transform="rotate(-0 410.148 177.721713)">Invalid or stale state</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(410.148 197.754563)">Reject / retain incumbent</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(410.148 210.153719)">No inherited authority</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5d6577" x="284.04" y="261.7272" transform="rotate(-0 284.04 261.7272)">STOP · expiry · scope · wall deadline · work limit are checked at boundaries</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5d6577" x="284.04" y="283.9032" transform="rotate(-0 284.04 283.9032)">A local freshness guard is not a cryptographic defense against a host administrator.</text>
