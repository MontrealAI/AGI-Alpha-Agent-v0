    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(20.664 123.070531)">Retains a bounded feature rule</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(20.664 135.469688)">Output: a feasible schedule</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007a78" x="213.732" y="78.239369" transform="rotate(-0 213.732 78.239369)">G2  Lookahead</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(213.732 98.272219)">Tries the next decision</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(213.732 110.671375)"/>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(213.732 123.070531)">Runs parent to finish suffixes</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(213.732 135.469688)">Output: a selected next action</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a17e2c" x="406.8" y="78.239369" transform="rotate(-0 406.8 78.239369)">G3  Repair</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(406.8 98.272219)">Preserves committed work</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(406.8 110.671375)"/>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(406.8 123.070531)">May use inherited suffix planner</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #1c2536" transform="translate(406.8 135.469688)">Stable branch can skip parent</text>
   </g>
   <g id="text_8">
