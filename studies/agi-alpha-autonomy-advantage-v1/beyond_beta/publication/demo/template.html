<script>
'use strict';
const DATA=JSON.parse(document.getElementById('demo-data').textContent),COPY=JSON.parse(document.getElementById('demo-copy').textContent);
let language='en',gate=0,selection={...DATA.preselected};
const $=id=>document.getElementById(id),t=key=>{if(!(key in COPY[language]))throw new Error('Missing translation '+key);return COPY[language][key];};
const esc=value=>String(value??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const number=(x,d=0)=>x==null||!Number.isFinite(Number(x))?t('noMetric'):new Intl.NumberFormat(language==='fr'?'fr-CA':'en-US',{maximumFractionDigits:d}).format(x);
const money=x=>x==null||!Number.isFinite(Number(x))?t('noMetric'):new Intl.NumberFormat(language==='fr'?'fr-CA':'en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(x);
const ready=()=>DATA.status==='REGISTERED_RESULTS'&&DATA.results;
const SCENARIOS={'reference':'scenarioReference','beta-v2-erases-contracts':'scenarioEraseContracts','beta-v3-erases-all':'scenarioEraseAll','alpha-zero':'scenarioZero','alpha-harm':'scenarioHarm','high-overlap':'scenarioOverlap','sharing-adaptation-fails':'scenarioAdapt','cash-delay':'scenarioCash','low-repeat':'scenarioLowRepeat','resource-cost-4x':'scenarioCost','correlated-spec-errors':'scenarioCommon','rapid-baseline':'scenarioRapid','no-demand':'scenarioNoDemand','high-repeat':'scenarioHighRepeat','slow-beta':'scenarioSlow','high-repeat-slow-beta':'scenarioHighSlow','diverse-hard':'scenarioDiverse','quota-tight':'scenarioQuota','short-alpha-life':'scenarioShort'};
const ARMS={'moving-beta-only':'armBeta','private-alpha-availability-ablation':'armPrivate','network-alpha':'armNetwork','network-alpha-frozen-beta':'armNetworkFrozen','frozen-beta-only':'armFrozen','trained-beta':'armTrainedBeta'};
function scenarioName(id){return SCENARIOS[id]?t(SCENARIOS[id]):id;}function armName(id){return ARMS[id]?t(ARMS[id]):id;}
function selectedWorld(){return DATA.results?.worlds?.find(x=>x.summary?.scenario===selection.scenario&&x.summary?.seed===Number(selection.seed)&&x.summary?.arm===selection.arm)||null;}
function translate(){document.documentElement.lang=language;document.querySelector('.nav').setAttribute('aria-label',t('sections'));document.querySelector('.evidence-legend').setAttribute('aria-label',t('evidenceCategories'));document.title=t('heroTitle').replaceAll('\n',' ')+' — BeyondBeta';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang-en').setAttribute('aria-pressed',String(language==='en'));$('lang-fr').setAttribute('aria-pressed',String(language==='fr'));$('languages').setAttribute('aria-label',t('language'));$('gate-buttons').setAttribute('aria-label',t('alphaTitleSection'));}
function renderStatus(){const r=ready();$('study-status').classList.toggle('ready',!!r);$('status-title').textContent=t(r?'readyTitle':'pendingTitle');$('status-text').textContent=t(r?'readyText':'pendingText');$('reading-status').textContent=t(r?'readingReady':'readingPending');const op=DATA.results?.operational;const timing=op?.continuationUsed?' '+t('operationalTiming').replace('{campaign}',number(op.recordedCampaignWallSecondsLowerBound,2)).replace('{original}',number(op.originalRecordedWallSecondsLowerBound,2)).replace('{continuation}',number(op.continuationCompletionWallSeconds,2)):'';$('operational-note').textContent=r?t(op?.continuationUsed?'operationalContinuation':'operationalSingle')+timing:'';$('audit-note').textContent=r?t('auditDisclosure'):'';$('actual-jobs').textContent=number(DATA.actualEvidence.acceptedCommercialJobs);$('actual-revenue').textContent=money(DATA.actualEvidence.collectedRevenueUsd);$('actual-cost').textContent=DATA.actualEvidence.completeStudyCostUsd==null?t('unknown'):money(DATA.actualEvidence.completeStudyCostUsd);$('footer-binding').textContent=DATA.binding[0].sha256.slice(0,16);}
function renderHuman(){const h=DATA.protocol.humanReference;['low','ref','high'].forEach((id,i)=>$('hours-'+id).textContent=number(h.taskHours[i]));$('wbs-body').innerHTML=h.wbs.map((r,i)=>`<tr><td>${esc(t('wbs'+i))}</td><td class="numeric">${number(r.hoursLow)}</td><td class="numeric">${number(r.hoursReference)}</td><td class="numeric">${number(r.hoursHigh)}</td></tr>`).join('');}
function options(items,selected,label){return items.map(x=>`<option value="${esc(x)}" ${String(x)===String(selected)?'selected':''}>${esc(label(x))}</option>`).join('');}
function renderControls(){$('scenario-select').innerHTML=options(DATA.protocol.scenarios.map(x=>x.id),selection.scenario,scenarioName);$('arm-select').innerHTML=options(DATA.protocol.experiment.confirmationArms,selection.arm,armName);$('seed-select').innerHTML=options(DATA.protocol.experiment.confirmationSeeds,selection.seed,x=>x);}
function renderSelected(){renderCommercial();const world=selectedWorld(),s=world?.summary;const normal=selection.scenario===DATA.preselected.scenario&&selection.arm===DATA.preselected.arm&&Number(selection.seed)===DATA.preselected.seed;$('selection-note').textContent=t(normal?'defaultSelection':'exploratorySelection')+' · '+selection.scenario+' / '+selection.seed+' / '+selection.arm;$('metric-value').textContent=money(s?.completeProfitUSD);$('metric-accepted').textContent=number(s?.accepted);$('metric-false').textContent=number(s?.falsePasses);$('metric-cash').textContent=money(s?.availableOperatingUSD);$('metric-price').textContent=money(world?.metrics?.priceAcceptedMean);$('metric-unit-cost').textContent=money(s?.costPerAcceptedUSD);$('metric-turnaround').textContent=number(world?.metrics?.meanTurnaroundDays,1);$('metric-effort').textContent=number(world?.metrics?.customerIntakeHours,1);$('turnaround-unit').textContent=t('days');$('effort-unit').textContent=t('hours');const pk={reference:'profileReference',efficient:'profileEfficient',burdensome:'profileBurdensome'};$('human-comparison-note').textContent=t('profileLabel')+': '+(s?t(pk[s.profile]):t('pending'))+' · '+t('humanReferenceLabel')+': '+money(world?.metrics?.humanReferenceAcceptedMean);document.querySelectorAll('.metric-basis').forEach(e=>e.textContent=t(s?'conditional':'pending'));renderCash(world?.cashRows||[],!!world);const counts=world?.candidateStates||{};$('story-events').textContent=!s?t('chainPending'):Object.keys(counts).length?t('allCandidateStates')+' · '+Object.entries(counts).map(([k,n])=>k+': '+number(n)).join(' · '):t('noCandidates');renderFinancial(world);renderFirstPaid(world);}
function renderCommercial(){const get=arm=>DATA.results?.worlds?.find(w=>w.summary.scenario===selection.scenario&&w.summary.seed===Number(selection.seed)&&w.summary.arm===arm);const beta=get('trained-beta'),alpha=get('network-alpha');const rows=[['humanReferenceLabel',w=>money(w?.metrics?.humanReferenceAcceptedMean)],['priceChosen',w=>money(w?.metrics?.priceAcceptedMean)],['fullUnitCost',w=>money(w?.summary?.costPerAcceptedUSD)],['meanValue',w=>money(w?.summary?.completeProfitUSD)],['availableCash',w=>money(w?.summary?.availableOperatingUSD)],['accepted',w=>number(w?.summary?.accepted)],['commercialThroughput',w=>number(w?w.summary.accepted/DATA.protocol.experiment.weeks:null,2)],['turnaround',w=>number(w?.metrics?.meanTurnaroundDays,1)+' '+t('days')],['wrongPass',w=>number(w?.summary?.falsePasses)]];$('commercial-body').innerHTML=rows.map(([key,value])=>`<tr><td>${esc(t(key))}</td><td class="numeric">${esc(value(beta))}</td><td class="numeric">${esc(value(alpha))}</td></tr>`).join('');$('commercial-world-note').textContent=t('commercialProfile')+' · '+scenarioName(selection.scenario)+' / '+selection.seed;}
function renderFinancial(world){const amounts=world?.spending||{};const values=[['ledgerA',amounts.A],['ledgerB',amounts.B],['ledgerC',amounts.C],['ledgerOperations',amounts.OPERATIONS],['ledgerFinancial',amounts.FINANCIAL],['ledgerCollected',world?.summary?.collectionsUSD],['ledgerSeed',world?.seedUSD],['ledgerReserve',world?.remainingReservedUSD]];$('financial-body').innerHTML=values.map(([k,v])=>`<tr><td>${esc(t(k))}</td><td class="numeric">${money(v)}</td></tr>`).join('');}
function renderFirstPaid(world){const x=world?.firstPaidCandidate;let rows=[];if(!world)rows=[['firstPaidPending',null]];else if(!x)rows=[['noPaidCandidate',null]];else rows=[['originJob',x.originJobId],['originAcceptance',t(x.originUsefulAccepted?'yes':'no')],['originNetReceipt',money(x.originNetReceiptUSD)],['originCompletionWeek',number(x.originCompletionWeek)],['originCollectionWeek',number(x.originCollectionWeek)],['candidateDecisionWeek',number(x.decisionWeek)],['candidateIdentity',x.id],['candidateOutcome',x.state],['originDeliveryCost',money(x.originDeliveryAUSD)],['additionalRetentionCost',money(x.retentionBUSD)],['separateResearchCost',money(x.researchCUSD)],['candidateAvailableCash',money(x.availableDecisionFundsUSD)],['candidateEarnedCash',money(x.earnedFundsAfterHoldsUSD)],['candidateFunding',x.wholeInitialFunding?t(x.wholeInitialFunding==='OPERATING_GENERATED'?'fundingEarned':'fundingSeed'):t('noMetric')],['candidateFreshCases',number(x.freshQualificationCases)],['candidateUses',number(x.subsequentUses)],['candidateDirectNet',money(x.directAttributedNetUSD)]];$('first-paid-body').innerHTML=rows.map(([k,v])=>`<tr><td>${esc(t(k))}</td><td class="numeric">${v==null?'':esc(v)}</td></tr>`).join('');}
function renderCash(input,worldPresent=false){const node=$('cash-chart');if(!input.length){node.className='chart-placeholder';node.textContent=t(worldPresent?'cashNotEmbedded':'cashPending');return;}const rows=input.map(x=>Array.isArray(x)?{week:x[0],cashUSD:x[1],operatingUSD:x[2]}:x);node.className='';const w=1000,h=230,p=35,vals=rows.flatMap(x=>[x.cashUSD,x.operatingUSD??0]),lo=Math.min(0,...vals),hi=Math.max(1,...vals),span=hi-lo||1,start=rows[0].week,end=rows.at(-1).week;const points=key=>rows.map(x=>`${p+(x.week-start)*(w-2*p)/Math.max(1,end-start)},${h-p-((x[key]??0)-lo)/span*(h-2*p)}`).join(' ');node.innerHTML=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('cashTitle'))}"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d5cddd"/><polyline points="${points('cashUSD')}" fill="none" stroke="#77518f" stroke-width="3"/><polyline points="${points('operatingUSD')}" fill="none" stroke="#216b59" stroke-width="3"/><text x="${p}" y="18" fill="#65556f" font-size="12">${esc(money(hi))}</text><text x="${w-p}" y="18" text-anchor="end" fill="#77518f" font-size="12">${esc(t('cashSeed'))} · ${esc(t('cashOperating'))}</text><text x="${p}" y="${h-5}" fill="#65556f" font-size="12">${esc(t('week'))} ${start}</text><text x="${w-p}" y="${h-5}" text-anchor="end" fill="#65556f" font-size="12">${esc(t('week'))} ${end}</text></svg>`;}
function renderConditions(){const aggregates=DATA.results?.conditions||[];$('conditions-body').innerHTML=DATA.protocol.scenarios.map(sc=>{const r=aggregates.find(x=>x.scenario===sc.id);return `<tr><td>${esc(scenarioName(sc.id))}<br><small class="muted mono">${esc(sc.id)}</small></td><td class="numeric">${number(r?.pairedWorlds)}</td><td class="numeric">${money(r?.betaMeanCompleteProfitUSD)}</td><td class="numeric">${money(r?.meanOptionalCompleteProfitUSD)}</td><td class="numeric">${money(r?.meanWholePolicyIncrementUSD)}</td><td class="numeric">${money(r?.meanAlphaIncrementUSD)}</td><td class="numeric">${money(r?.meanSharingIncrementUSD)}</td></tr>`;}).join('');$('result-binding').textContent=ready()?t('copyBinding'):t('emptyResults');}
function renderStory(){$('story-steps').innerHTML=Array.from({length:6},(_,i)=>`<article class="step"><div class="step-heading"><b>${String(i+1).padStart(2,'0')}</b><h3>${esc(t('step'+i))}</h3></div><p>${esc(t('step'+i+'Body'))}</p></article>`).join('');$('moves').innerHTML=Array.from({length:7},(_,i)=>`<span class="move">${i+1}. ${esc(t('move'+i))}</span>`).join('');}
function renderGate(){$('gate-buttons').innerHTML=Array.from({length:6},(_,i)=>`<button type="button" class="gate" data-gate="${i}" aria-pressed="${i===gate}"><span>${i+1}</span>${esc(t('gate'+i))}</button>`).join('');$('gate-title').textContent=t('gate'+gate);$('gate-description').textContent=t('gate'+gate+'Text');$('gate-buttons').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{gate=Number(b.dataset.gate);renderGate();}));}
function renderChecks(){const c=DATA.graphControls;$('controls-count').textContent=c?`${number(c.tests-(c.failures||0)-(c.errors||0))} / ${number(c.tests)}`:t('pending');const tests=DATA.graphReviews.reduce((n,r)=>n+r.controls,0),held=DATA.graphReviews.reduce((n,r)=>n+r.invariantsHeld,0);$('independent-count').textContent=tests?`${number(held)} / ${number(tests)}`:t('pending');$('v93-count').textContent=number(DATA.sourceInspection.v93.probes.filter(x=>x.kind==='draft_invariant_violation'&&x.observed).length);}
function renderNetwork(){const positions=[[110,55],[325,55],[540,55],[110,265],[325,265],[540,265]],domains=['domainNumerical','domainPlanning','domainInterfaces','domainStateful','domainProof','domainGeneral'];$('network-labels').innerHTML=positions.map(([x,y],i)=>`<text x="${x}" y="${y}">${esc(t('agent'))} ${i+1}</text><text x="${x}" y="${y+23}" fill="#c4b5d0" font-size="11">${esc(t(domains[i]))}</text>`).join('');$('network-center').textContent=t('networkCenter');$('network-title').textContent=t('networkTitle');$('network-desc').textContent=t('networkCaption');$('beta-timeline').innerHTML=DATA.protocol.betaVersions.map(v=>`<div class="version"><strong>${esc(v.id)}</strong><span>${esc(t('week'))} ${number(v.startWeek)}</span><br><span class="tag assumed">${esc(t('assumed'))}</span></div>`).join('');}
function renderClaims(){const keys=['claimDelivery','claimHuman','claimAlpha','claimSharing','claimGraph','claimLifecycle','claimErosion','claimFunding'];$('claim-cards').innerHTML=keys.map(key=>{const r=DATA.results?.claims?.find(x=>x.id===key);const local=key==='claimLifecycle';const status=r?.status||(local?'observed':'pending');const note=r?.[language]||t(local?'claimLifecycleNote':'claimPending');return `<article class="claim"><div><h3>${esc(t(key))}</h3><p>${esc(note)}</p></div><span class="tag ${local?'observed':''}">${esc(COPY[language][status]||status)}</span></article>`;}).join('');}
function renderExternalSources(){const ids=['swe-proof-v2','swe-live-v2','metr-rct-2025','metr-update-2026','bls-software-2025','bls-ecec-june2026','official-current-models','official-tools'];$('external-sources-body').innerHTML=DATA.externalSourceRegister.sources.filter(s=>ids.includes(s.id)).map(s=>`<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></td><td>${esc(EXTERNAL_SCOPE[s.id]?.[language]||s.scope||'')}</td></tr>`).join('');}
const EXTERNAL_SCOPE={
'swe-proof-v2':{en:'Supplied correct specifications improve one reported proof workflow. Self-generated specification validity and hidden assumptions remain material limits. No Astra/Terra calibration is inferred.',fr:'Des spécifications correctes fournies améliorent un processus de preuve rapporté. La validité des spécifications auto-générées et les hypothèses cachées restent des limites majeures. Aucune calibration Astra/Terra n’en est déduite.'},
'swe-live-v2':{en:'Live repository tasks motivate fresh evaluation and reproducible specification/acceptance boundaries; benchmark scores do not set our quality assumptions.',fr:'Les tâches de dépôts vivants motivent des évaluations nouvelles et des critères reproductibles de spécification et d’acceptation; leurs scores ne fixent pas nos hypothèses de qualité.'},
'metr-rct-2025':{en:'A scoped experiment with experienced developers cautions against equating benchmark capability with end-to-end work-time savings.',fr:'Une expérience circonscrite avec des développeurs expérimentés invite à ne pas assimiler capacité sur benchmark et gain de temps sur un travail complet.'},
'metr-update-2026':{en:'A later design update qualifies generalization from the earlier developer study. Neither establishes this service’s delivery economics.',fr:'Une mise à jour ultérieure de la méthode nuance la généralisation de l’étude précédente. Aucune n’établit l’économie de livraison de ce service.'},
'bls-software-2025':{en:'A US occupational wage anchor informs a rate proxy. The 64/180/488-hour task estimates are independently declared assumptions.',fr:'Un salaire professionnel américain sert de repère à un taux indicatif. Les estimations de 64/180/488 heures sont des hypothèses déclarées séparément.'},
'bls-ecec-june2026':{en:'An economy-wide benefit ratio informs loaded labor cost; it is not a software-consulting quote or role-specific benefits measurement.',fr:'Un ratio général d’avantages sociaux éclaire le coût chargé du travail; ce n’est ni un devis de conseil logiciel ni une mesure propre à ce métier.'},
'official-current-models':{en:'Current official model access, roles and reasoning options; all task performance and aggregate resource envelopes remain assumptions.',fr:'Accès, rôles et options de raisonnement des modèles selon la documentation officielle actuelle; performance sur ces tâches et budgets de ressources restent hypothétiques.'},
'official-tools':{en:'Published API/tool price anchors, separately from assumed usage, integration, maintenance and business costs.',fr:'Repères de prix publiés pour API et outils, distincts des usages supposés et des coûts d’intégration, d’entretien et d’exploitation.'}
};
function renderSources(){$('sources-body').innerHTML=DATA.sources.map(s=>`<tr><td>${esc(s.title)}${s.url?`<br><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(t('sourceLink'))} ↗</a>`:''}</td><td>${esc(t(s.url?'external':'sourceSupplied'))}</td><td><code>${esc(s.sha256)}</code></td></tr>`).join('');}
function render(){translate();renderStatus();renderHuman();renderControls();renderSelected();renderConditions();renderStory();renderGate();renderChecks();renderNetwork();renderClaims();renderExternalSources();renderSources();}
function setLanguage(value){if(!COPY[value])return;language=value;render();try{localStorage.setItem('beyond-beta-language',value);}catch{}}
function download(){const selected=selectedWorld();const packet={...DATA,view:{language,selection,selectedWorld:selected}};const blob=new Blob([JSON.stringify(packet,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=t('downloadFilename');link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
$('lang-en').addEventListener('click',()=>setLanguage('en'));$('lang-fr').addEventListener('click',()=>setLanguage('fr'));$('download-record').addEventListener('click',download);['scenario','arm','seed'].forEach(key=>$(key+'-select').addEventListener('change',event=>{selection[key]=key==='seed'?Number(event.target.value):event.target.value;renderSelected();}));$('restore-default').addEventListener('click',()=>{selection={...DATA.preselected};renderControls();renderSelected();$('announcer').textContent=t('selectionRestored');});try{const saved=localStorage.getItem('beyond-beta-language');if(saved in COPY)language=saved;}catch{}render();
window.BeyondBetaDemo={setLanguage,getState:()=>({language,selection:{...selection},gate,status:DATA.status}),data:DATA};
</script>
