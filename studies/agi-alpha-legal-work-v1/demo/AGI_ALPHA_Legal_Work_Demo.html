<section class="panel" id="packet" role="tabpanel" aria-labelledby="tab-packet"><div class="sectionhead"><div><h2 data-en="A complete source trail" data-fr="Des sources intégralement traçables"></h2><p data-en="Choose a fresh case. Every visible passage comes from its original synthetic documents. Amendments remain separate for professional interpretation." data-fr="Choisissez un nouveau cas. Chaque passage provient de ses documents synthétiques d’origine. Les avenants restent distincts pour l’interprétation professionnelle."></p></div></div><div class="toolbar"><label><span data-en="Fresh case" data-fr="Nouveau cas"></span><select id="case"></select></label><label><span data-en="Comparison method" data-fr="Méthode de comparaison"></span><select id="method"><option value="characters" data-en="Character comparison" data-fr="Comparaison par caractères"></option><option value="lines" data-en="Line comparison" data-fr="Comparaison par lignes"></option></select></label><div class="receipt" id="receipt"></div></div><div class="notice" data-en="This packet establishes exact text conservation. Legal meaning, compliance, amendment precedence and usefulness to counsel have not been professionally assessed." data-fr="Ce dossier établit la conservation exacte du texte. Le sens juridique, la conformité, la priorité des avenants et l’utilité pour le juriste n’ont pas fait l’objet d’une évaluation professionnelle."></div><div class="card"><h3 data-en="Source-linked redline" data-fr="Modifications reliées aux sources"></h3><div class="legend"><span class="removed" data-en="Removed text" data-fr="Texte supprimé"></span><span class="added" data-en="Added text" data-fr="Texte ajouté"></span><span class="neutral" data-en="Unchanged context" data-fr="Contexte inchangé"></span></div><pre class="document" id="redline"></pre><div class="metrics" id="packetmetrics"></div></div><div class="columns"><div class="card"><h3 data-en="Original" data-fr="Version d’origine"></h3><pre class="document" id="original"></pre></div><div class="card"><h3 data-en="Revised" data-fr="Version modifiée"></h3><pre class="document" id="revised"></pre></div></div><div class="card" id="amendmentcard"><h3 data-en="Separate amendments" data-fr="Avenants distincts"></h3><div id="amendments"></div></div><details><summary data-en="Inspect source identities and review responsibilities" data-fr="Vérifier l’identité des sources et les responsabilités de révision"></summary><div id="hashes"></div><ul><li data-en="Read changed passages in their full context." data-fr="Lire les passages modifiés dans leur contexte intégral."></li><li data-en="Determine amendment effect and legal meaning independently." data-fr="Déterminer indépendamment l’effet des avenants et le sens juridique."></li><li data-en="Make the final professional decision; no automatic edits or external actions occur here." data-fr="Prendre la décision professionnelle finale ; aucune modification automatique ni action externe n’a lieu ici."></li></ul><p class="small" data-en="Source documents remain in English, matching the tested scope. This is a replay of sealed research evidence, not an intake service." data-fr="Les documents sources restent en anglais, conformément au périmètre testé. Il s’agit d’une consultation des résultats de recherche figés, pas d’un service de réception de dossiers."></p></details></section>
<section class="panel" id="study" role="tabpanel" aria-labelledby="tab-study" hidden><div class="sectionhead"><div><h2 data-en="A bounded experiment with preserved failures" data-fr="Une expérience limitée dont les échecs sont conservés"></h2><p data-en="Only 2 of 24 broader playbook packets met every technical acceptance criterion. The remaining discovery budget tested a narrower text-reconciliation product on 12 additional fresh cases." data-fr="Le prototype fondé sur un guide de révision n’a produit que 2 dossiers complets sur 24 répondant aux critères techniques. Le budget restant a permis de tester une comparaison textuelle plus restreinte sur 12 nouveaux cas."></p></div></div><div class="flow"><div class="card"><span class="step" data-en="01 · FREEZE" data-fr="01 · FIGER"></span><h3 data-en="Freeze the methods" data-fr="Figer les méthodes"></h3><p data-en="Code and acceptance rules were frozen before an independent agent authored the fresh cases." data-fr="Le code et les règles d’acceptation ont été figés avant la rédaction des nouveaux cas par un agent indépendant."></p></div><div class="card"><span class="step" data-en="02 · DELIVER" data-fr="02 · PRODUIRE"></span><h3 data-en="Keep every attempt" data-fr="Conserver chaque tentative"></h3><p data-en="All predictions were sealed before private annotations were released. Rejected packets remain in the companion." data-fr="Toutes les prédictions ont été scellées avant la divulgation des annotations privées. Les dossiers rejetés sont conservés."></p></div><div class="card"><span class="step" data-en="03 · EVALUATE" data-fr="03 · ÉVALUER"></span><h3 data-en="Separate the claims" data-fr="Distinguer les résultats"></h3><p data-en="Technical conservation, legal correctness, customer value and available cash are separate outcomes." data-fr="La conservation technique, l’exactitude juridique, la valeur client et la trésorerie disponible sont des résultats distincts."></p></div></div><div class="card"><h3 data-en="Fresh playbook results · 24 cases, eight rules per case" data-fr="Résultats du guide · 24 nouveaux cas, huit règles par cas"></h3><div class="tablewrap"><table><thead><tr><th data-en="Method" data-fr="Méthode"></th><th data-en="Complete packets" data-fr="Dossiers complets"></th><th data-en="Correct rule statuses" data-fr="Classements exacts"></th><th data-en="Weighted status error" data-fr="Erreur pondérée"></th></tr></thead><tbody id="primarytable"></tbody></table></div><p class="evaluation-note" data-en="B: ordinary regex/diff baseline. C1: B plus definition/reference resolver. C: C1 plus amendment resolver. D: separately authored conventional code, not a commercial legal-software trial. No qualified lawyer adjudicated the synthetic rule keys." data-fr="B : référence classique à base d’expressions régulières. C1 : B avec résolution des définitions et renvois. C : C1 avec résolution d’avenants. D : code classique indépendant, pas un essai de logiciel juridique commercial. Les annotations synthétiques n’ont pas été évaluées par un avocat qualifié."></p></div><div class="evidence-grid"><div class="card"><h3 data-en="What the retained skill changed" data-fr="L’effet de la capacité conservée"></h3><p class="outcome" data-en="Five additional correct rule statuses. No additional accepted complete packet." data-fr="Cinq classements exacts supplémentaires. Aucun dossier complet accepté supplémentaire."></p><p class="small" data-en="Every arm missed one issue rated severity 3 in the research rubric concerning responsibility for representatives. No revisions were proposed; zero unsupported revisions therefore reflects abstention." data-fr="Chaque méthode a manqué un écart de niveau 3 selon le barème de recherche concernant la responsabilité des représentants. Aucune révision n’a été proposée ; l’absence de révisions non étayées découle donc de cette abstention."></p></div><div class="card"><h3 data-en="What remains unknown" data-fr="Ce qui reste inconnu"></h3><p data-en="Human review time, highlighting usability, paid demand, complete production cost and professional acceptance." data-fr="Le temps de révision humaine, l’utilité du surlignage, la demande payante, le coût total de production et l’acceptation professionnelle."></p><p class="small" data-en="The independent case author and checker are agents in the same research session. This is not external legal peer review or a customer pilot." data-fr="L’auteur indépendant des cas et l’évaluateur sont des agents de la même session de recherche. Il ne s’agit ni d’une expertise juridique externe ni d’un projet pilote client."></p></div></div></section>
<section class="panel" id="economics" role="tabpanel" aria-labelledby="tab-economics" hidden><div class="sectionhead"><div><h2 data-en="What would make this worth buying?" data-fr="Qu’est-ce qui justifierait un achat ?"></h2><p data-en="These prerecorded sensitivity coordinates ask how much professional time must be saved to cover a fee and added integration. No time saving or willingness to pay was measured." data-fr="Ces paramètres de sensibilité préétablis indiquent le temps professionnel à économiser pour couvrir un prix et l’intégration supplémentaire. Aucun gain de temps ni disposition à payer n’a été mesuré."></p></div></div><div class="toolbar"><label><span data-en="Offered price · CAD" data-fr="Prix proposé · CAD"></span><select id="price"><option value="500">5</option><option value="1000" selected>10</option><option value="2000">20</option></select></label><label><span data-en="Added integration · minutes" data-fr="Temps d’intégration supplémentaire · minutes"></span><select id="integration"><option value="0">0</option><option value="1" selected>1</option><option value="5">5</option></select></label><label><span data-en="Ordinary review · minutes" data-fr="Révision classique · minutes"></span><select id="review"><option>1</option><option>3</option><option>5</option><option selected>10</option><option>20</option></select></label></div><div class="columns"><div class="card"><h3 data-en="Required professional time saved" data-fr="Économie de temps professionnel nécessaire"></h3><span class="big" id="saved"></span><p id="thresholdtext"></p><p class="small" data-en="Sourced Ontario lawyer employee median: CAD 65.21/hour. Assumed employment burden: 1.3×. This is opportunity cost, not a lawyer’s invoice or avoided payroll." data-fr="Salaire horaire médian publié des avocats salariés en Ontario : 65,21 CAD. Facteur de charges supposé : 1,3. Il s’agit d’un coût d’opportunité, pas d’une facture d’avocat ni d’une économie salariale réalisée."></p></div><div class="card"><h3 data-en="Buyer savings with equal review effort" data-fr="Économie client à effort de révision égal"></h3><span class="big" id="savings"></span><p data-en="Equal review effort is the neutral assumption because no comparative human-time benefit was measured. Existing ordinary software may already be licensed." data-fr="Un effort de révision égal constitue l’hypothèse neutre, car aucun avantage comparatif de temps humain n’a été mesuré. Le logiciel classique peut déjà être disponible sous licence."></p><p class="small" data-en="Reducing a cost estimate in this explorer does not create a sale or establish legal reliability." data-fr="Réduire une estimation de coût dans cet outil ne crée pas de vente et n’établit pas la fiabilité juridique."></p></div></div><div class="card"><h3 data-en="The tested reinvestment loop" data-fr="La boucle de réinvestissement testée"></h3><p class="outcome" data-en="0 of 216 simulated worlds funded a first or second capability from operating surplus." data-fr="Aucune des 216 réalisations simulées n’a financé une première ou une deuxième capacité à partir d’un surplus d’exploitation."></p><p data-en="The 26-week playbook reference had mean simulated cash net result of −CAD 428.92 and zero simulated collections. Every tested reinvestment-world cash net result was negative. These scenarios use assumed demand, prices, attention and costs; they are not market probabilities." data-fr="La référence sur 26 semaines affichait un solde de trésorerie d’exploitation simulé moyen de −428,92 CAD et aucun encaissement simulé. Le résultat était négatif dans chaque scénario de réinvestissement. La demande, les prix, le temps humain et les coûts reposent sur des hypothèses ; il ne s’agit pas de probabilités de marché."></p><div class="rule" data-en="Actual collections: CAD 0 · Complete actual cost: unknown · Actual available surplus: unidentified · Token financing: none" data-fr="Encaissements réels : 0 CAD · Coût réel total : inconnu · Surplus réel disponible : non établi · Financement par jeton : aucun"></div></div></section>

<script>
'use strict';
const data=JSON.parse(document.getElementById('evidence').textContent);
let language='en';
const byId=id=>document.getElementById(id);
const choose=(en,fr)=>language==='en'?en:fr;
const number=(n,d=2)=>Number(n).toLocaleString(language==='en'?'en-CA':'fr-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const cases=[...new Set(data.packets.map(p=>p.case_id))].sort();
for(const id of cases){const option=document.createElement('option');option.value=id;option.textContent=id;byId('case').append(option);}
function addText(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n;}
function renderPacket(){
 const p=data.packets.find(p=>p.case_id===byId('case').value&&p.method===byId('method').value);if(!p)return;
 const redline=byId('redline');redline.replaceChildren();
 let oldChanged=0,newChanged=0,changes=0;
 for(const op of p.operations){const old=op.original_span.quote,now=op.revised_span.quote;
  if(op.kind==='equal')redline.append(document.createTextNode(old));else{changes++;oldChanged+=Array.from(old).length;newChanged+=Array.from(now).length;if(old)addText(redline,'del',old);if(now)addText(redline,'ins',now);}}
 byId('original').textContent=p.documents.original;byId('revised').textContent=p.documents.revised;
 byId('packetmetrics').textContent=choose(`${changes} changed operations · ${oldChanged} original / ${newChanged} revised highlighted characters · Professional acceptance: unknown`,`${changes} segments de modification · ${oldChanged} caractères d’origine / ${newChanged} révisés surlignés · Acceptation professionnelle : inconnue`);
 const accepted=data.reconciliation.records.find(r=>r.case_id===p.case_id&&r.method===p.method)?.accepted_independent===true;
 byId('receipt').textContent=accepted?choose('SOURCE IDENTITIES VERIFIED · Both complete texts reconstruct exactly','IDENTITÉS DES SOURCES VÉRIFIÉES · Les deux textes sont intégralement reconstitués'):choose('Technical check failed · inspect evidence','Échec du contrôle technique · examiner les éléments');
 const am=byId('amendments');am.replaceChildren();
 if(!p.amendments.length)addText(am,'p',choose('No separate amendments supplied.','Aucun avenant distinct fourni.'),'small');
 for(const a of p.amendments){const box=addText(am,'div','','amend');addText(box,'strong',a.document);addText(box,'p',a.quote);addText(box,'span',choose('Effect not interpreted','Effet non interprété'),'badge');}
 const hashes=byId('hashes');hashes.replaceChildren();for(const [name,hash]of Object.entries(p.source_hashes)){addText(hashes,'p',name+' · SHA-256 '+hash,'hash');}
}
function renderPrimary(){const body=byId('primarytable');body.replaceChildren();for(const arm of ['B','C1','C','D']){const r=data.primary[arm],tr=document.createElement('tr');for(const t of [arm,`${r.accepted_deterministic} / ${r.cases}`,`${r.rules_correct} / ${r.rules_total}`,`${r.weighted_status_error} / ${r.weighted_status_possible}`])addText(tr,'td',t);body.append(tr);}}
function renderEconomics(){const r=data.thresholds.find(r=>r.offeredPriceCentsAssumed===Number(byId('price').value)&&r.addedBuyerIntegrationMinutesAssumed===Number(byId('integration').value)&&r.ordinaryReviewMinutesAssumed===Number(byId('review').value));
 byId('saved').textContent=number(r.requiredSavedMinutesToBreakEven)+' min';byId('savings').textContent=number(r.buyerSavingsAtNoMeasuredAdvantageCents/100)+' CAD';
 byId('thresholdtext').textContent=r.sufficientEvenIfAllOrdinaryMinutesRemoved?choose('A necessary threshold only. A future timed comparison must show at least this saving while preserving accepted quality.','Un seuil nécessaire uniquement. Une comparaison chronométrée future devra montrer au moins cette économie en conservant une qualité acceptée.'):choose('Even removing all assumed ordinary review time would not cover this price plus added integration.','Même supprimer tout le temps de révision classique supposé ne couvrirait pas ce prix et l’intégration supplémentaire.');}
function setLanguage(lang){language=lang;document.documentElement.lang=lang;for(const el of document.querySelectorAll('[data-en]'))el.textContent=el.dataset[lang].replaceAll('\\n','\n');for(const code of ['en','fr']){byId(code).classList.toggle('active',code===lang);byId(code).setAttribute('aria-pressed',String(code===lang));}renderPacket();renderPrimary();renderEconomics();}
for(const code of ['en','fr'])byId(code).addEventListener('click',()=>setLanguage(code));
for(const id of ['case','method'])byId(id).addEventListener('change',renderPacket);
for(const id of ['price','integration','review'])byId(id).addEventListener('change',renderEconomics);
for(const tab of document.querySelectorAll('[data-panel]'))tab.addEventListener('click',()=>{for(const other of document.querySelectorAll('[data-panel]'))other.setAttribute('aria-selected',String(other===tab));for(const panel of document.querySelectorAll('section.panel'))panel.hidden=panel.id!==tab.dataset.panel;});
byId('exactcount').textContent=data.reconciliation.records.filter(r=>r.accepted_independent).length+' / '+data.reconciliation.records.length;
setLanguage('en');
</script></body></html>
