 playbook results · 24 cases, eight rules per case" data-fr="Résultats du guide · 24 nouveaux cas, huit règles par cas"></h3><div class="tablewrap"><table><thead><tr><th data-en="Method" data-fr="Méthode"></th><th data-en="Complete packets" data-fr="Dossiers complets"></th><th data-en="Correct rule statuses" data-fr="Classements exacts"></th><th data-en="Weighted status error" data-fr="Erreur pondérée"></th></tr></thead><tbody id="primarytable"></tbody></table></div><p class="evaluation-note" data-en="B: ordinary regex/diff baseline. C1: B plus definition/reference resolver. C: C1 plus amendment resolver. D: separately authored conventional code, not a commercial legal-software trial. No qualified lawyer adjudicated the synthetic rule keys." data-fr="B : référence classique à base d’expressions régulières. C1 : B avec résolution des définitions et renvois. C : C1 avec résolution d’avenants. D : code classique indépendant, pas un essai de logiciel juridique commercial. Les annotations synthétiques n’ont pas été évaluées par un avocat qualifié."></p></div><div class="evidence-grid"><div class="card"><h3 data-en="What the retained skill changed" data-fr="L’effet de la capacité conservée"></h3><p class="outcome" data-en="Five additional correct rule statuses. No additional accepted complete packet." data-fr="Cinq classements exacts supplémentaires. Aucun dossier complet accepté supplémentaire."></p><p class="small" data-en="Every arm missed one issue rated severity 3 in the research rubric concerning responsibility for representatives. No revisions were proposed; zero unsupported revisions therefore reflects abstention." data-fr="Chaque méthode a manqué un écart de niveau 3 selon le barème de recherche concernant la responsabilité des représentants. Aucune révision n’a été proposée ; l’absence de révisions non étayées découle donc de cette abstention."></p></div><div class="card"><h3 data-en="What remains unknown" data-fr="Ce qui reste inconnu"></h3><p data-en="Human re rd"><h3 data-en="Buyer savings with equal review effort" data-fr="Économie client à effort de révision égal"></h3><span class="big" id="savings"></span><p data-en="Equal review effort is the neutral assumption because no comparative human-time benefit was measured. Existing ordinary software may already be licensed." data-fr="Un effort de révision égal constitue l’hypothèse neutre, car aucun avantage comparatif de temps humain n’a été mesuré. Le logiciel classique peut déjà être disponible sous licence."></p><p class="small" data-en="Reducing a cost estimate in this explorer does not create a sale or establish legal reliability." data-fr="Réduire une estimation de coût dans cet outil ne crée pas de vente et n’établit pas la fiabilité juridique."></p></div></div><div class="card"><h3 data-en="The tested reinvestment loop" data-fr="La boucle de réinvestissement testée"></h3><p class="outcome" data-en="0 of 216 simulated worlds funded a first or second capability from operating surplus." data-fr="Aucune des 216 réalisations simulées n’a financé une première ou une deuxième capacité à partir d’un surplus d’exploitation."></p><p data-en="The 26-week playbook reference had mean simulated cash net result of −CAD 428.92 and zero simulated collections. Every tested reinvestment-world cash net result was negative. These scenarios use assumed demand, prices, attention and costs; they are not market probabilities." data-fr="La référence sur 26 semaines affichait un solde de trésorerie d’exploitation simulé moyen de −428,92 CAD et aucun encaissement simulé. Le résultat était négatif dans chaque scénario de réinvestissement. La demande, les prix, le temps humain et les coûts reposent sur des hypothèses ; il ne s’agit pas de probabilités de marché."></p><div class="rule" data-en="Actual collections: CAD 0 · Complete actual cost: unknown · Actual available surplus: unidentified · Token financing: none" data-fr="Encaissements réels : 0 CAD · Coût réel total : inconnu · Surplus réel <script>
'use strict';
const data=JSON.parse(document.getElementById('evidence').textContent);
let language='en';
const byId=id=>document.getElementById(id);
const choose=(en,fr)=>language==='en'?en:fr;
const number=(n,d=2)=>Number(n).toLocaleString(language==='en'?'en-CA':'fr-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const cases=[...new Set(data.packets.map(p=>p.case_id))].sort();
for(const id of cases){const option=document.createElement('option');option.value=id;option.textContent=id;byId('case').append(option);}
function addText(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n;}
function renderPacket(){
 const p=data.packets.find(p=>p.case_id===byId('case').value&&p.method===byId('method').value);if(!p)return;
 const redline=byId('redline');redline.replaceChildren();
 let oldChanged=0,newChanged=0,changes=0;
 for(const op of p.operations){const old=op.original_span.quote,now=op.revised_span.quote;
  if(op.kind==='equal')redline.append(document.createTextNode(old));else{changes++;oldChanged+=Array.from(old).length;newChanged+=Array.from(now).length;if(old)addText(redline,'del',old);if(now)addText(redline,'ins',now);}}
 byId('original').textContent=p.documents.original;byId('revised').textContent=p.documents.revised;
 byId('packetmetrics').textContent=choose(`${changes} changed operations · ${oldChanged} original / ${newChanged} revised highlighted characters · Professional acceptance: unknown`,`${changes} segments de modification · ${oldChanged} caractères d’origine / ${newChanged} révisés surlignés · Acceptation professionnelle : inconnue`);
 const accepted=data.reconciliation.records.find(r=>r.case_id===p.case_id&&r.method===p.method)?.accepted_independent===true;
 byId('receipt').textContent=accepted?choose('SOURCE IDENTITIES VERIFIED · Both complete texts reconstruct exactly','IDENTITÉS DES SOURCES VÉRIFIÉES · Les deux textes sont intégralement reconstitués'):choose('Technical check failed · inspect evidence','Échec du contrôle technique · examiner les éléments');
 const am=byId('amendments');am.replaceChildren();
 if(!p.amendments.length)addText(am,'p',choose('No separate amendments supplied.','Aucun avenant distinct fourni.'),'small');
 for(const a of p.amendments){const box=addText(am,'div','','amend');addText(box,'strong',a.document);addText(box,'p',a.quote);addText(box,'span',choose('Effect not interpreted','Effet non interprété'),'badge');}
 const hashes=byId('hashes');hashes.replaceChildren();for(const [name,hash]of Object.entries(p.source_hashes)){addText(hashes,'p',name+' · SHA-256 '+hash,'hash');}
}
function renderPrimary(){const body=byId('primarytable');body.replaceChildren();for(const arm of ['B','C1','C','D']){const r=data.primary[arm],tr=document.createElement('tr');for(const t of [arm,`${r.accepted_deterministic} / ${r.cases}`,`${r.rules_correct} / ${r.rules_total}`,`${r.weighted_status_error} / ${r.weighted_status_possible}`])addText(tr,'td',t);body.append(tr);}}
function renderEconomics(){const r=data.thresholds.find(r=>r.offeredPriceCentsAssumed===Number(byId('price').value)&&r.addedBuyerIntegrationMinutesAssumed===Number(byId('integration').value)&&r.ordinaryReviewMinutesAssumed===Number(byId('review').value));
 byId('saved').textContent=number(r.requiredSavedMinutesToBreakEven)+' min';byId('savings').textContent=number(r.buyerSavingsAtNoMeasuredAdvantageCents/100)+' CAD';
 byId('thresholdtext').textContent=r.sufficientEvenIfAllOrdinaryMinutesRemoved?choose('A necessary threshold only. A future timed comparison must show at least this saving while preserving accepted quality.','Un seuil nécessaire uniquement. Une comparaison chronométrée future devra montrer au moins cette économie en conservant une qualité acceptée.'):choose('Even removing all assumed ordinary review time would not cover this price plus added integration.','Même supprimer tout le temps de révision classique supposé ne couvrirait pas ce prix et l’intégration supplémentaire.');}
function setLanguage(lang){language=lang;document.documentElement.lang=lang;for(const el of document.querySelectorAll('[data-en]'))el.textContent=el.dataset[lang].replaceAll('\\n','\n');for(const code of ['en','fr']){byId(code).classList.toggle('active',code===lang);byId(code).setAttribute('aria-pressed',String(code===lang));}renderPacket();renderPrimary();renderEconomics();}
for(const code of ['en','fr'])byId(code).addEventListener('click',()=>setLanguage(code));
for(const id of ['case','method'])byId(id).addEventListener('change',renderPacket);
for(const id of ['price','integration','review'])byId(id).addEventListener('change',renderEconomics);
for(const tab of document.querySelectorAll('[data-panel]'))tab.addEventListener('click',()=>{for(const other of document.querySelectorAll('[data-panel]'))other.setAttribute('aria-selected',String(other===tab));for(const panel of document.querySelectorAll('section.panel'))panel.hidden=panel.id!==tab.dataset.panel;});
byId('exactcount').textContent=data.reconciliation.records.filter(r=>r.accepted_independent).length+' / '+data.reconciliation.records.length;
setLanguage('en');
</script></body></html>
