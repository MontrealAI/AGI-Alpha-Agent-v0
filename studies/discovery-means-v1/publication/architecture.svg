<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="t d">
<title id="t">The constructed investigation and its authority boundary</title><desc id="d">Supplied hypotheses, possible observations, permissions and budgets enter the adaptive policy constructor. A separate checker audits every branch. A user can inspect the artifact or supply a bounded transcript. Actual signed native research custody records the artifact. Production execution remains unqualified.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#71598b"/></marker></defs>
<rect width="960" height="590" fill="#fff"/>
<g font-family="DejaVu Sans,sans-serif" text-anchor="middle" fill="#302447">
<text x="480" y="33" font-size="22" font-weight="bold">A complete contingent investigation</text>
<rect x="205" y="60" width="550" height="75" rx="8" fill="#f4f0f8" stroke="#cbbddc"/>
<text x="480" y="90" font-size="18" font-weight="bold">Declared investigation</text><text x="480" y="117" font-size="16">Hypotheses · possible observations · permissions · caps</text>
<path d="M480 136V170" stroke="#71598b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="180" width="550" height="75" rx="8" fill="#302447"/>
<text x="480" y="211" font-size="18" fill="#fff" font-weight="bold">Adaptive policy constructor</text><text x="480" y="239" font-size="16" fill="#e6dff1">Choose a probe; preserve every possible continuation</text>
<path d="M340 255V286H230V310M620 255V286H730V310" fill="none" stroke="#71598b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="320" width="350" height="84" rx="8" fill="#edf5f5" stroke="#8db5b9"/>
<text x="230" y="350" font-size="18" font-weight="bold">Independent branch checker</text><text x="230" y="377" font-size="13">Outcome coverage · conclusions · path costs</text>
<rect x="555" y="320" width="350" height="84" rx="8" fill="#f4f0f8" stroke="#cbbddc"/>
<text x="730" y="350" font-size="18" font-weight="bold">Inspect or continue</text><text x="730" y="377" font-size="16">Policy JSON · bounded supplied transcript</text>
<path d="M405 362H545" stroke="#71598b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="345" font-size="13">checked artifact</text>
<path d="M730 404V442H480V465" fill="none" stroke="#a598b1" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<rect x="205" y="475" width="550" height="75" rx="8" fill="#fff8ed" stroke="#b88a50" stroke-dasharray="6 5"/>
<text x="480" y="504" font-size="18" font-weight="bold">Actual signed native research custody</text><text x="480" y="531" font-size="16">Readback + replay refusal; paused-uncertain</text>
<text x="480" y="579" font-size="13" fill="#625d6a">Architecture diagram. Production execution and external authority remain unqualified.</text>
</g></svg>
