<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="ex_title ex_desc">
<title id="ex_title">The executed authored example: pay only for the observed branch</title><desc id="ex_desc">A screen costs one unit. L or L2 leads to the left test; R or R2 leads to the right test. Each branch test costs two units. All possible observations lead to exactly one compatible hypothesis. Worst path cost is three units; purchasing both branch tests statically costs four.</desc>
<defs><marker id="ex_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#71598b"/></marker></defs>
<rect width="880" height="310" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" fill="#302447" text-anchor="middle">
<rect x="340" y="10" width="200" height="44" rx="7" fill="#302447"/>
<text x="440" y="38" fill="white" font-size="20" font-weight="bold">screen · 1 unit</text>
<path d="M440 54V76H220V110M440 76H660V110" stroke="#71598b" stroke-width="2" fill="none" marker-end="url(#ex_arrow)"/>
<text x="220" y="95" font-size="17">L / L2</text><text x="660" y="95" font-size="17">R / R2</text>
<rect x="130" y="118" width="180" height="40" rx="7" fill="#edf5f5" stroke="#8db5b9"/>
<rect x="570" y="118" width="180" height="40" rx="7" fill="#f4f0f8" stroke="#cbbddc"/>
<text x="220" y="145" font-size="19" font-weight="bold">left · 2 units</text><text x="660" y="145" font-size="19" font-weight="bold">right · 2 units</text>
<path d="M220 158V179H110V215M220 179H330V215M660 158V179H550V215M660 179H770V215" fill="none" stroke="#71598b" stroke-width="2" marker-end="url(#ex_arrow)"/>
<text x="110" y="201" font-size="17">a / a2</text><text x="330" y="201" font-size="17">b / b2</text><text x="550" y="201" font-size="17">c / c2</text><text x="770" y="201" font-size="17">d / d2</text>
<rect x="60" y="223" width="100" height="39" rx="6" fill="#fff8ed" stroke="#b88a50"/><text x="110" y="249" font-size="20" font-weight="bold">H0</text>
<rect x="280" y="223" width="100" height="39" rx="6" fill="#fff8ed" stroke="#b88a50"/><text x="330" y="249" font-size="20" font-weight="bold">H1</text>
<rect x="500" y="223" width="100" height="39" rx="6" fill="#fff8ed" stroke="#b88a50"/><text x="550" y="249" font-size="20" font-weight="bold">H2</text>
<rect x="720" y="223" width="100" height="39" rx="6" fill="#fff8ed" stroke="#b88a50"/><text x="770" y="249" font-size="20" font-weight="bold">H3</text>
<text x="440" y="296" font-size="17">Worst contingent path: 3 units · Static left + right: 4 units · Units are not currency</text></g></svg>
