 badge:'Local research offering · 26 October 2026',eyebrow:'AGI ALPHA FLYWHEEL · USEFUL WORK FIRST',title:'The decision that carries its evidence.',lede:'A maintainer needs to know whether a dependency change preserves the behavior their software relies on. Here is a complete component assessment, the evidence behind it, and the honest cost of making the next assessment easier.',nav:['Useful result','What was retained','Fresh work','Complete cost','Next investment'],choose:'Choose a completed assessment',dev:'First useful outcome · exposed development',fresh:'Fresh comparison',result:'Component behavior preserved',status:'Internally verified within the declared component contract',action:'Accept this component evidence for the next qualification stage. Keep the current native application lock until the remaining application and release checks are complete.',scope:'RequestBoundary and the enumerated Mission, Review and Control input contracts. The original FastAPI import route and real 15-second timeout are retained.',before:'Verified before',after:'Verified after',cases:'Declared requirements',download:'Download the evidence packet',json:'Decision JSON',patch:'Exact lock patch',zipnote:'The ZIP contains this decision, sources, observations, verification, exact component locks and receipts. The full companion supplies wheels and the offline runtime reproduction.',needTitle:'The buyer’s job',need:'An AGI ALPHA maintainer can use this packet to accept a bounded compatibility work package and plan the next qualification step, or to hold a change when a required behavior fails.',need2:'The observed need is internal software maintenance. The proposed refresh is a research assessment; no customer order, maintainer acceptance or payment was observed.',remaining:'Work that remains',todo:['Decide whether this refresh is needed for the maintained release.','Qualify the full dependency lock and supported platforms.','Complete authorized authentication, persistence and mission-e fr:{badge:'Offre de recherche locale · 26 octobre 2026',eyebrow:'AGI ALPHA FLYWHEEL · LE TRAVAIL UTILE D’ABORD',title:'La décision conserve ses preuves.',lede:'Un responsable logiciel doit savoir si une dépendance modifiée préserve les comportements dont son application dépend. Voici une évaluation complète des composants, ses preuves et le coût documenté de la prochaine évaluation.',nav:['Résultat utile','Capacité conservée','Nouvelles missions','Coût complet','Prochain investissement'],choose:'Choisir une évaluation terminée',dev:'Premier résultat utile · développement exposé',fresh:'Comparaison sur de nouveaux cas',result:'Comportement des composants préservé',status:'Vérification interne dans le périmètre défini',action:'Accepter ces preuves limitées aux composants pour la qualification suivante. Conserver le verrou natif actuel jusqu’aux contrôles complets de l’application et de publication.',scope:'RequestBoundary et les contrats d’entrée énumérés de Mission, Review et Control. Le chemin d’importation FastAPI d’origine et le délai réel de 15 secondes sont conservés.',before:'Cas vérifiés avant',after:'Cas vérifiés après',cases:'Exigences définies',download:'Télécharger le dossier de preuves',json:'Décision JSON',patch:'Modification exacte du verrou',zipnote:'Le ZIP contient la décision, le code source, les observations, les vérifications, les verrous exacts des composants et les reçus. Le compagnon complet fournit les paquets et la reproduction hors ligne.',needTitle:'Le besoin de l’utilisateur',need:'Un responsable d’AGI ALPHA peut accepter ce dossier limité de compatibilité et planifier la qualification suivante, ou suspendre une modification lorsqu’un comportement requis échoue.',need2:'Le besoin observé concerne la maintenance interne. La mise à jour proposée est une évaluation de recherche ; aucune commande cliente, acceptation par un responsable ni aucun paiement n’ont été observés.',remaining:'Travail restant',todo:['Déterminer si la version maintenue nécessite cette mise à jour.','Qualifier toutes les dépendances et les plateformes prises en charge.','Terminer les contrôles autorisés d’authentification, de persistance et d’exécution des missions.','Obtenir la revue des responsables et les autorisations de publication existantes.'],retainTitle:'Produire les preuves avec le résultat.',retainIntro:'Le changement de méthode relie exécution, vérification et livraison autour d’un dossier lié au code source. Une dépendance modifiée justifie une nouvelle évaluation ; une demande inchangée constitue une reproduction.',steps:[['Observer le comportement réel','Exécuter les composants inchangés dans les environnements exacts avant et après.'],['Conserver les preuves avec la décision','Relier exigences, observations, identités du code, reçus de ressources et action suivante.'],['Vérifier avant la livraison','Un vérificateur indépendant contrôle chaque résultat requis ; une preuve absente ou périmée bloque une décision positive.'],['Réutiliser sur une entrée modifiée','La même capacité exécutable a traité six nouvelles transitions par le Workbench local existant.']],retainedCaveat:'Le constructeur conservé a adopté le contrôle de reçus plus robuste du constructeur conventionnel. Cette contribution et les coûts de construction des deux méthodes restent imputables.',freshTitle:'Six entrées modifiées. Le même critère d’acceptation.',freshIntro:'Une comparaison figée ; six transitions historiques représentatives dans deux familles de paquets. Chaque méthode a évalué les mêmes six missions. Les tests, profils avant/après et répétitions ne sont pas des missions clientes supplémentaires.',armA:'A · Assistée par le chercheur',armB:'B · Capacité conservée',armC:'C · Méthode conventionnelle',metricAccepted:'Évaluations acceptées par méthode',metricAuto:'Finalisations par mission, B / C',metricA:'Finalisations explicites dans A',metricPaid:'Missions clientes payées',transition:'Transition de dépendance',quality:'Préservé',freshCaption:'Tous les dossiers satisfont le contrat fini de l’étude. Six missions historiques sur une plateforme ne mesurent pas la fiabilité en production. Aucune régression réelle des dépendances n’a été trouvée dans cette confirmation.',compareTitle:'Ce qui a changé et les conclusions encore ouvertes',compare:'Les deux constructeurs ont livré le dossier complet sans décision du chercheur à chaque mission. La méthode conventionnelle a égalé la qualité acceptée. L’étude n’établit pas une meilleure méthode de construction, une économie de minutes d’attention ni une augmentation du résultat final.',measure:'Quantité mesurée',accepted:'Évaluations acceptées',mechanical:'Médiane mécanique, secondes',cpu:'Médiane du temps CPU mesuré',span:'Médiane du délai complet, secondes',finalizations:'Finalisations explicites du chercheur',timing:'Le délai complet de A inclut l’attente du chercheur et l’ordonnancement de cette session. Ce n’est ni une durée de travail humain, ni une facture, ni une économie d’attention mesurée. Le délai réel de 15 secondes domine la durée mécanique. Les mesures sont descriptives, avec une exécution sur un hôte partagé.',costTitle:'Rendre le coût complet visible.',costIntro:'Les ressources d’exécution connues sont enregistrées. Les prix et efforts non mesurés restent inconnus. Un composant rapide ne démontre pas la rentabilité du service.',costs:['Coût marginal de livraison','Coût récurrent à utilisation déclarée','Coût complet de livraison','Encaissements clients réels'],unknown:'Inconnu',zero:'0 $ observé',costLabels:['L’infrastructure imputable et la facturation ne sont pas rapprochées.','L’utilisation, l’entretien et les exceptions résiduelles ne sont pas mesurés.','La découverte, la construction, les échecs, l’examen critique et l’intégration restent imputables.','Aucune vente, aucun transfert, produit de jeton ou gain client n’est compté comme trésorerie.'],humanTitle:'Une comparaison humaine défendable',human:'Le salaire médian publié par le BLS pour les analystes et testeurs de qualité logicielle est de 50,14 USD par heure. La durée de la tâche équivalente n’est pas mesurée. Un professionnel compétent peut utiliser les mêmes outils ordinaires et caches.',threshold:'Seuil salarial : 1,19665 minute humaine par USD de coût automatisé complet.',human2:'C’est un seuil algébrique, pas une économie observée. Le prix client, l’effort client, les économies du client et le coût du prestataire sont distincts. Le repère montréalais de 46,26 CAD/heure donne un seuil séparé de 1,29702 minute par CAD.',price:'Aucun prix client ni aucune marge correspondant exactement à ce périmètre ne sont établis. Une offre plus large ne peut pas fixer le prix de ce dossier.',investTitle:'Le prochain investissement doit résoudre l’incertitude.',investIntro:'L’expérience établit un résultat d’ingénierie réutilisable. Elle ne démontre ni remboursement monétaire ni expansion finançable.',states:[['Résultat opérationnel','Des dossiers automatisés complets ont été livrés sur les six nouvelles missions. Les outils conventionnels ont égalé le résultat.'],['Remboursement économique','Inconnu : coûts incrémentaux complets, travail actif économisé, entretien et volume crédible ne sont pas établis.'],['Expansion finançable','Non établie : les encaissements observés sont nuls ; trésorerie disponible, obligations, réserves et allocation approuvée sont inconnues.']],next:'Prochain test justifié : appliquer le dossier à une vraie décision de maintenance en attente, mesurer l’acceptation et le travail actif face à la méthode ordinaire, puis rapprocher la facture applicable. Mesurer la demande récurrente avant de financer davantage de développement. Aucune prospection, dépense engagée ni transaction n’est lancée ici.',evidence:'Examiner les preuves',identity:'Identités exactes',method:'Protocole figé et reproduction',ledger:'Télécharger résultats et coûts transparents',links:'Coordination du projet et proposition de code',limits:'Les preuves de composants n’autorisent ni publication, ni action d’opérateur, ni règlement financier. Recherche locale, CI isolée, exploitation approuvée et production restent distinctes.',footer:'Construit sur AGI ALPHA, TRANSFORMATIONAL INTELLIGENCE ∞ et le Workbench SUCCESSOR Ω existant. La construction assistée est déclarée. La planification en $AGIALPHA reste inerte ; le règlement USDC du Manager suit un circuit distinct. Aucune transaction ni autorité financière n’ont été exercées.',downloaded:'Téléchargement préparé',packetName:'Dossier de preuves',methodText:'Six missions, trois méthodes, une exécution par paire. Sources et protocole figés avant l’acquisition des paquets sélectionnés. Les 83 fichiers figés sont inchangés. Délai réel : 15 s ; limite du processus : 45 s ; deux profils en parallèle ; une mission à la fois. Le compagnon permet une reproduction hors ligne sous Python 3.12 / Linux x86-64.',qualityNote:'Acceptation selon l’étude ; acceptation cliente non observée.'}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString(lang==='fr'?'fr-FR':'en-US',{maximumFractionDigits:3,minimumFractionDigits:3});
function label(p){return p.id==='development'?T[lang].dev:p.changes.filter(c=>c.package!=='pydantic-core').map(c=>c.package+' '+c.before+' → '+c.after).join(' · ')}
function render(){const t=T[lang],p=D.packets.find(p=>p.id===selected),a=D.by_arm,arms=['manual','retained','conventional'];document.documentElement.lang=lang;document.getElementById('en').setAttribute('aria-pressed',lang==='en');document.getElementById('fr').setAttribute('aria-pressed',lang==='fr');
document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">${t.eyebrow}</div><h1>${t.title}</h1><p class="lede">${t.lede}</p><span class="badge">${t.badge}</span><nav class="nav">${['outcome','retained','fresh','cost','next'].map((id,i)=>`<a href="#${id}">${t.nav[i]}</a>`).join('')}</nav></section>
<section class="section" id="outcome"><div class="select-row"><label for="mission">${t.choose}</label><select id="mission">${D.packets.map(q=>`<option value="${q.id}" ${q.id===selected?'selected':''}>${esc(label(q))}</option>`).join('')}</select></div><div class="grid"><article class="card result"><div class="label">${p.id==='development'?t.dev:t.fresh}</div><div class="status">${t.status}</div><h3>${t.result}</h3>${p.changes.map(c=>`<div class="version"><b>${esc(c.package)}</b><span>${esc(c.before)} → ${esc(c.after)}</span></div>`).join('')}<p class="action">${t.action}</p><p class="fine">${t.scope}</p><div class="checks"><div><strong>61 / 61</strong><span>${t.before}</span></div><div><strong>61 / 61</strong><span>${t.after}</span></div><div><strong>61</strong><span>${t.cases}</span></div></div><div class="actions"><button class="primary" id="download-packet">${t.download}</button><button id="download-decision">${t.json}</button><button id="download-patch">${t.patch}</button></div><p class="fine" style="margin-top:15px">${t.zipnote}</p></article><aside class="card"><div class="label">${t.needTitle}</div><p>${t.need}</p><p class="subtle small">${t.need2}</p><h3 style="margin-top:24px">${t.remaining}</h3><ol class="ordered small">${t.todo.map(s=>`<li>${s}</li>`).join('')}</ol></aside></div></section>
<section class="section" id="retained"><div class="eyebrow">02 · ${t.nav[1]}</div><h2>${t.retainTitle}</h2><p class="subtle">${t.retainIntro}</p><div class="grid"><div class="card">${t.steps.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}</div><div><p class="quote">${t.retainedCaveat}</p><p class="small subtle">${t.limits}</p><div class="pill">Local Workbench</div><div class="pill">Native HOLD</div><div class="pill">Authority []</div></div></div></section>
<section class="section" id="fresh"><div class="eyebrow">03 · ${t.nav[2]}</div><h2>${t.freshTitle}</h2><p class="subtle">${t.freshIntro}</p><div class="metrics"><div class="metric"><div class="label">${t.metricAccepted}</div><div class="big">6 / 6</div><div class="small">${t.qualityNote}</div></div><div class="metric"><div class="label">${t.metricAuto}</div><div class="big">0 / 0</div><div class="small">${t.armB} / ${t.armC}</div></div><div class="metric"><div class="label">${t.metricA}</div><div class="big">6</div><div class="small">${t.armA}</div></div><div class="metric"><div class="label">${t.metricPaid}</div><div class="big">0</div><div class="small">${t.costs[3]}</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>${t.transition}</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>${D.packets.slice(1).map(q=>`<tr><td>${esc(label(q))}</td>${arms.map(()=>`<td class="pass">${t.quality}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="caption">${t.freshCaption}</p><h3 style="margin-top:32px">${t.compareTitle}</h3><p class="subtle">${t.compare}</p><div class="table-wrap"><table class="data-table"><thead><tr><th>${t.measure}</th><th>${t.armA}</th><th>${t.armB}</th><th>${t.armC}</th></tr></thead><tbody><tr><td>${t.accepted}</td><td>6 / 6</td><td>6 / 6</td><td>6 / 6</td></tr>${[[t.mechanical,'mechanical_wall_seconds'],[t.cpu,'measured_local_cpu_seconds'],[t.span,'service_span_seconds']].map(([title,key])=>`<tr><td>${title}</td>${arms.map(x=>`<td>${fmt(a[x][key].median)}</td>`).join('')}</tr>`).join('')}<tr><td>${t.finalizations}</td><td>6</td><td>0</td><td>0</td></tr></tbody></table></div><div class="note">${t.timing}</div></section>
<section class="section" id="cost"><div class="eyebrow">04 · ${t.nav[3]}</div><h2>${t.costTitle}</h2><p class="subtle">${t.costIntro}</p><div class="cost-grid">${t.costs.map((s,i)=>`<article class="cost"><div class="label">${s}</div><div class="value ${i===3?'zero':''}">${i===3?t.zero:t.unknown}</div><div class="small subtle">${t.costLabels[i]}</div></article>`).join('')}</div><div class="grid" style="margin-top:30px"><div><h3>${t.humanTitle}</h3><p class="small subtle">${t.human} <a href="https://www.bls.gov/news.release/ocwage.t01.htm" target="_blank" rel="noopener">BLS</a></p><div class="equation">${t.threshold}</div><p class="small subtle">${t.human2} <a href="https://on.jobbank.gc.ca/marketreport/wages-occupation/22511/geo25154" target="_blank" rel="noopener">Job Bank</a></p></div><div class="note" style="align-self:start">${t.price}</div></div></section>
<section class="section" id="next"><div class="eyebrow">05 · ${t.nav[4]}</div><h2>${t.investTitle}</h2><p class="subtle">${t.investIntro}</p><div class="card">${t.states.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}</div><p class="quote">${t.next}</p></section>
<section class="section"><h2>${t.evidence}</h2><details><summary>${t.identity}</summary><p class="small">Decision SHA256</p><code>${p.decision_sha256}</code><p class="small">Primary freeze SHA256</p><code>${D.freeze_sha256}</code><p class="small">Campaign SHA256</p><code>${D.campaign_sha256}</code><p class="small">${t.packetName} ZIP SHA256</p><code>${p.download.sha256}</code><p class="small subtle">${esc(p.path)}</p></details><details><summary>${t.method}</summary><p class="small subtle">${t.methodText}</p><pre>python publication/replay_mission.py --mission pydantic-3 --arm conventional --out reproduction/new-check</pre><p class="small subtle">${t.limits}</p></details><button id="download-record">${t.ledger}</button><p class="small subtle" style="margin-top:20px">${t.links}: <a href="https://github.com/MontrealAI/AGI-Alpha-Agent-v0/issues/4850#issuecomment-6419703808" target="_blank" rel="noopener">#4850 · freeze</a> · <a href="https://github.com/MontrealAI/AGI-Alpha-Agent-v0/pull/4932" target="_blank" rel="noopener">#4932 · draft</a></p></section>`;
document.getElementById('footer').textContent=t.footer;document.getElementById('mission').onchange=e=>{selected=e.target.value;render()};document.getElementById('download-packet').onclick=()=>save(Uint8Array.from(atob(p.download.base64),c=>c.charCodeAt(0)),`AGIALPHA_${p.id}_Evidence.zip`,'application/zip');document.getElementById('download-decision').onclick=()=>save(p.decision_text,`${p.id}-decision.json`,'application/json');document.getElementById('download-patch').onclick=()=>save(p.patch,`${p.id}-component-lock.patch`,'text/plain');document.getElementById('download-record').onclick=()=>save(JSON.stringify({schema:'useful-work-demo-summary/v1',by_arm:D.by_arm,runs:D.runs,economics:D.economics,freeze_sha256:D.freeze_sha256,campaign_sha256:D.campaign_sha256},null,2),'AGIALPHA_Useful_Work_Summary.json','application/json');}
function save(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);const toast=document.getElementById('toast');toast.textContent=T[lang].downloaded;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}
document.getElementById('en').onclick=()=>{lang='en';render()};document.getElementById('fr').onclick=()=>{lang='fr';render()};render();
</script><noscript><p style="padding:30px">This interactive demonstration requires JavaScript. The companion also contains English/French Markdown decision packets and JSON evidence. Cette démonstration interactive nécessite JavaScript ; les dossiers Markdown anglais/français et les preuves JSON restent disponibles dans le compagnon.</p></noscript></body></html>
