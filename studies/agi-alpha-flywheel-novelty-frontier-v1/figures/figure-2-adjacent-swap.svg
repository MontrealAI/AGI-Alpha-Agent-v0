   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #301356" x="21.708" y="26.636456" transform="rotate(-0 21.708 26.636456)">One adjacent swap defeats a pairwise readout</text>
  </g>
  <g id="text_46">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6a6375" x="21.708" y="42.775716" transform="rotate(-0 21.708 42.775716)">Only the AB relation changes; a conventional XOR bit supplies extra information</text>
  </g>
  <g id="text_47">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b67a26" x="21.708" y="251.8884" transform="rotate(-0 21.708 251.8884)">Pairwise record: {ABCD, BACD}</text>
  </g>
  <g id="text_48">
   <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2f8b78" x="272.556" y="251.8884" transform="rotate(-0 272.556 251.8884)">+ XOR: unique recovery</text>
  </g>
  <g id="text_49">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #6a6375" transform="translate(21.708 276.200312)">Known erasure, four single-use events. An added coded bit is not a demonstrated mechanical part.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #6a6375" transform="translate(21.708 286.67825)">One parity bit detects one wrong bit; it cannot generally correct that unmarked error.</text>
  </g>
 </g>
