  <g id="text_24">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #6a6375" transform="translate(21.708 289.469912)">Parity adds one stored bit; its erased position is included in the denominator.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #6a6375" transform="translate(21.708 299.94785)">The repair is conventional coding. These are finite computations, not physical-device tests.</text>
