function paintLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{if(e.dataset.i18n==='title')e.innerHTML=t('title');else e.textContent=t(e.dataset.i18n)});['en','fr'].forEach(x=>{$(x).classList.toggle('active',x===lang);$(x).setAttribute('aria-pressed',x===lang)});const selected=$('preset').value;$('preset').replaceChildren(...UI_SCENARIOS.map(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=PRESETS[lang][s.id]||s.id;return o}));$('preset').value=selected||'reference-assumptions';renderEvidence();if(current)render();}

function lineChart(){const svg=$('cashChart'),w=560,h=300,l=65,r=15,top=18,bottom=35,series=['A','B','C'].map(a=>current.arms[a].histories.balances),vals=series.flatMap(s=>s.map(v=>v.cashCents/100)),low=Math.min(0,...vals),high=Math.max(1,...vals)*1.08,steps=Math.max(...series.map(s=>s.at(-1).week)),x=v=>l+(w-l-r)*v/steps,y=v=>top+(h-top-bottom)*(high-v)/(high-low);let out='';for(let i=0;i<5;i++){const v=low+(high-low)*i/4,yy=y(v);out+=`<line class="axis" x1="${l}" y1="${yy}" x2="${w-r}" y2="${yy}"/><text x="${l-8}" y="${yy+4}" text-anchor="end">${num(v,0)}</text>`}for(let i=0;i<=4;i++){const v=Math.round(steps*i/4);out+=`<text x="${x(v)}" y="${h-12}" text-anchor="middle">${v}</text>`}const colors=['#b7aacd','#b991ff','#8aecd3'];series.forEach((s,i)=>{out+=`<polyline fill="none" stroke="${colors[i]}" stroke-width="${i===1?4:2}" ${i===2?'stroke-dasharray="5 5"':''} points="${s.map(v=>x(v.week)+','+y(v.cashCents/100)).join(' ')}"/>`});out+=`<text x="${l}" y="12">USD · ${t('simulation')}</text><text x="${w-r}" y="${h-12}" text-anchor="end">${t('week')}</text>`;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=out;}
function barChart(){const svg=$('choiceChart'),keys=['enterprise','human','ai','diy','defer','unsupported'],counts=Object.fromEntries(keys.map(k=>[k,0]));current.arms.B.histories.buyerChoices.forEach(v=>counts[v.choice]++);const w=560,h=300,max=Math.max(1,...Object.values(counts)),l=135;let out='';keys.forEach((k,i)=>{const y=22+i*43,width=(w-l-50)*counts[k]/max;out+=`<text x="${l-10}" y="${y+17}" text-anchor="end">${t(k)}</text><rect x="${l}" y="${y}" width="${width}" height="25" rx="4" fill="${k==='enterprise'?'#b991ff':k==='defer'?'#f1ce88':'#5d477c'}"/><text x="${l+width+8}" y="${y+17}">${counts[k]}</text>`});svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=out;}
function events(target,rows,format){const el=$(target);el.replaceChildren(...rows.map(r=>{const p=document.createElement('p');p.textContent=format(r);return p}));if(!rows.length)el.textContent=t('noEvents')}
function renderBuyer(){const rows=current.arms.B.histories.buyerChoices.filter(r=>r.offers&&r.offers.length),prior=+$('buyerRow').value||0;$('buyerRow').replaceChildren(...rows.map((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t('week')+' '+r.week+' · '+r.buyer+' · '+t(r.choice);return o}));$('buyerRow').value=Math.min(prior,Math.max(0,rows.length-1));const r=rows[+$('buyerRow').value];$('buyerVerdict').textContent=r?t('chosen')+' · '+t(r.choice):t('noEvents');$('buyerOffers').innerHTML=r?r.offers.map(o=>'<tr><td>'+t(o.id)+'</td><td class="n">'+money(o.priceCents)+'</td><td class="n">'+num(100*o.quality,1)+'%</td><td class="n">'+money(o.effortCents)+'</td><td class="n">'+money(o.delayCents)+'</td><td class="n">'+money(o.switchCents)+'</td><td class="n">'+money(o.utilityCents)+'</td></tr>').join(''):'';}
function eventLabel(value){const labels={en:{expense_payment:'Cost paid',refund:'Refund paid','change-posted-price':'Change quoted price','adopt-automation':'Adopt competitor automation'},fr:{expense_payment:'Coût payé',refund:'Remboursement payé','change-posted-price':'Modifier le prix','adopt-automation':'Adopter l’automatisation concurrente'}};return labels[lang][value]||value;}
function render(){const b=current.arms.B,s=b.summary,c=current.config;const funding=Funding.fundingView(b),g=funding.terminal;window.currentFundingView=funding;$('generatedFunds').textContent=money(g.fundingCeilingBeforeUnpricedDiscoveryCents);$('generatedDetails').textContent=t('strictEarned')+' · '+money(g.originalStrictEarnedAvailableCents)+' | '+t('cashCap')+' · '+money(g.cashCapAfterEarmarksCents)+' | '+t('generatedRecovery')+' · '+money(g.generatedAfterEarmarksCents);for(const id of ['demand','minutes','construction','collection','review','integration','adoption','reserveControl','maintenanceControl'])$(id+'Out').textContent=num(+$(id).value,2);$('profit').textContent=money(s.profitCents);$('increment').textContent=money(current.causal.B_minus_A_profitCents);$('investWeek').textContent=s.investmentWeek===null?t('noInvestment'):s.investmentWeek;$('investCost').textContent=t('assetCost')+' · '+money(s.assetFullCostAndUpkeepCents);$('cash').textContent=money(s.finalCashCents);$('cashHint').textContent=t('protectedReserve')+' · '+money(c.reserveCents);$('armTable').innerHTML=['A','B','C'].map(a=>{const z=current.arms[a].summary;return `<tr><td>${a} · ${t(a==='A'?'ordinary':a==='B'?'retained':'conventional')}</td><td>${z.enterpriseAccepted}</td><td>${z.enterpriseRejected}</td><td class="n">${money(z.grossCollectionsCents)}</td><td class="n">${money(z.accruedCostsCents)}</td><td class="n">${money(z.profitCents)}</td><td class="n">${money(z.finalCashCents)}</td></tr>`}).join('');const positive=current.causal.B_minus_A_profitCents>0&&s.investmentWeek!==null;$('verdict').textContent=t(positive?'verdictPositive':'verdictNo');$('verdict').className='status '+(positive?'':'wait');lineChart();barChart();renderBuyer();const quantities=[s.enterpriseAccepted,money(s.grossCollectionsCents),s.investmentWeek===null?t('noInvestment'):t('week')+' '+s.investmentWeek,s.assetUses,t('notAdmitted')];$('traceSteps').innerHTML=quantities.map((q,i)=>`<div class="step"><strong>${i+1}</strong><div><p>${t('trace'+(i+1))} · <b>${q}</b></p><span>${t('trace'+(i+1)+'s')}</span></div></div>`).join('');events('events',b.histories.cash,r=>`${t('week')} ${r.week} · ${r.type==='simulated_collection'?t('collections'):eventLabel(r.type)} · ${money(r.amountCents)} · ${t('cash')} ${money(r.cashAfterCents)}`);events('competitorEvents',b.histories.competitorActions,r=>`${t('week')} ${r.week} · ${t(r.provider)} · ${eventLabel(r.action)} · ${money(r.afterCents??r.costCents??0)}`);events('investmentEvents',b.histories.investmentDecisions,r=>`${t('week')} ${r.week} · ${t(r.action==='invest'?'invest':'retain')} · ${t('cash')} ${money(r.availableCashCents)} · ${t('assetCost')} ${money(r.fullCostCents)}`);$('canonical').textContent=JSON.stringify({basis:b.canonical.basis,observed:b.canonical.cash.summary.observed,scenarioEconomic:b.canonical.economic.summary.scenario,scenarioLiquidity:b.canonical.cash.summary.scenario},null,2);$('configuration').textContent=JSON.stringify(c,null,2);window.currentStudyRun=current;}
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===button.dataset.tab));if(current)render()});['en','fr'].forEach(x=>$(x).onclick=()=>{lang=x;paintLanguage()});$('preset').onchange=()=>{base={...Market.defaultConfig,...UI_SCENARIOS.find(s=>s.id===$('preset').value)};if($('preset').value==='diagnostic-predeclared')$('seed').value=2001;if($('preset').value.startsWith('continuation-'))$('seed').value=3001;syncControls();run()};for(const id of ['demand','minutes','construction','collection','review','choice','strategy','integration','funding','basis','adoption','pricing','targetPrice','reserveControl','maintenanceControl','seed'])$(id).addEventListener('input',run);$('buyerRow').onchange=renderBuyer;$('downloadScenario').onclick=()=>download('AGI_ALPHA_Market_Assumptions.json',JSON.stringify(current.config,null,2));$('downloadRun').onclick=()=>download('AGI_ALPHA_Paired_Market_History.json',JSON.stringify(current,null,2));$('downloadEvidence').onclick=()=>download('AGI_ALPHA_Executed_Production.json',JSON.stringify(EVIDENCE.production,null,2));$('downloadPacket').onclick=()=>{const selected=EVIDENCE.packets.find(p=>p.mission_id===$('packetChoice').value),data=Uint8Array.from(atob(selected?selected.base64:PACKET),c=>c.charCodeAt(0));download(selected?selected.packet:PACKET_NAME,data,'application/zip')};paintLanguage();syncControls();run();
</script></body></html>
