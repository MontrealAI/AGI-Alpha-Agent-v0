    const plotWidth=Math.max(280,Math.min(980,node.clientWidth));
    svg.setAttribute('viewBox',`0 0 ${plotWidth} 240`);svg.setAttribute('role','img');svg.setAttribute('aria-label',t('cashFigure'));svg.classList.add('cash-svg');
    const cash=rows.map(row=>row.cashUsd),available=rows.map(row=>row.availableUsd);
    if(cash.every(Number.isFinite)&&available.every(Number.isFinite)){
      const min=Math.min(0,...cash,...available),max=Math.max(1,scenario.reserveUsd||0,...cash,...available),span=max-min||1;
      const x=i=>45+(rows.length===1?0:i/(rows.length-1)*(plotWidth-65)),y=value=>195-(value-min)/span*160;
      for(const value of [min,(min+max)/2,max]){
        const line=document.createElementNS(namespace,'line');line.setAttribute('x1','45');line.setAttribute('x2',String(plotWidth-20));line.setAttribute('y1',y(value));line.setAttribute('y2',y(value));line.classList.add('axis');svg.append(line);
        const text=document.createElementNS(namespace,'text');text.setAttribute('x','4');text.setAttribute('y',y(value)+4);text.textContent=number(value,0);svg.append(text);
      }
      if(Number.isFinite(scenario.reserveUsd)){
        const reserve=document.createElementNS(namespace,'line');reserve.setAttribute('x1','45');reserve.setAttribute('x2',String(plotWidth-20));reserve.setAttribute('y1',y(scenario.reserveUsd));reserve.setAttribute('y2',y(scenario.reserveUsd));reserve.classList.add('reserve-line');svg.append(reserve);
      }
      for(const [values,style] of [[cash,'balance'],[available,'investable']]){
        const line=document.createElementNS(namespace,'polyline');line.setAttribute('points',values.map((value,index)=>`${x(index)},${y(value)}`).join(' '));line.classList.add(style);svg.append(line);
      }
      rows.forEach((row,index)=>{if(index===0||index===rows.length-1){const text=document.createElementNS(namespace,'text');text.setAttribute('x',x(index));text.setAttribute('y','225');text.setAttribute('text-anchor',index===0?'start':'end');text.textContent=String(local(row.period));svg.append(text);}});
      const legend=el('div',undefined,'cash-legend');legend.append(el('span',t('cashBalance')),el('span',t('investable'),'investable-key'),el('span',t('reserveLine'),'reserve-key'));node.append(legend,svg);
    }
    const wrap=el('div',undefined,'table-scroll ledger-scroll'),table=el('table'),head=el('thead'),header=el('tr');
    for(const label of ['period','revenue','deliveryCost','operatingAccrued','investments','reserve','cashBalance','balance'])header.append(el('th',t(label)));
    head.append(header);table.append(head);
    const body=el('tbody');
    for(const entry of rows){const row=el('tr');[local(entry.period),money(entry.collectionsUsd),money(entry.deliveryAndBusinessUsd),money(entry.accruedOperatingCostUsd),money(entry.investmentUsd),money(entry.reservesAndObligationsUsd),money(entry.cashUsd),money(entry.availableUsd)].forEach((value,index)=>row.append(el('td',value,index?'num':'')));body.append(row);}
    table.append(body);wrap.append(table);node.append(wrap);
  }
  const note=el('div',undefined,'note');note.append(el('strong',t('assumptions')),el('p',local(scenario.assumptions)),el('p',t('ledgerNote')));node.append(note);links(node,scenario.links);
}
function render(){document.documentElement.lang=language;document.getElementById('en').setAttribute('aria-pressed',String(language==='en'));document.getElementById('fr').setAttribute('aria-pressed',String(language==='fr'));document.getElementById('en').classList.toggle('active',language==='en');document.getElementById('fr').classList.toggle('active',language==='fr');for(const node of document.querySelectorAll('[data-i18n]')){const value=t(node.dataset.i18n);if(node.dataset.i18n==='title')node.innerHTML=value;else node.textContent=value;}document.getElementById('claim').textContent=local(evidence.conclusion)||t('pending');document.getElementById('claimScope').textContent=local(evidence.conclusionScope);document.getElementById('studyStatus').textContent=local(evidence.evidenceStatus)||t('pending');document.getElementById('revenueStatus').textContent=local(evidence.commercialStatus)||t('notMeasured');document.getElementById('authorityStatus').textContent=local(evidence.authorityStatus)||'HOLD';renderJobs();renderComparison();renderTransfer();renderCash();const sources=clear('sourceContent');if(!(evidence.sources||[]).length)pending(sources);else links(sources,evidence.sources);document.getElementById('freezeNote').textContent=evidence.frozenAt?`${t('frozen')}: ${evidence.frozenAt} · ${evidence.studyId||''}`:'';}
window.addEventListener('resize',renderCash);
document.getElementById('jobTabs').addEventListener('keydown',event=>{const count=(evidence.jobs||[]).length;if(!count||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();selectedJob=event.key==='Home'?0:event.key==='End'?count-1:(selectedJob+(event.key==='ArrowRight'?1:-1)+count)%count;renderJobs();document.getElementById(`job-tab-${selectedJob}`).focus();});document.getElementById('en').addEventListener('click',()=>{language='en';render();});document.getElementById('fr').addEventListener('click',()=>{language='fr';render();});document.getElementById('metric').addEventListener('change',renderComparison);document.getElementById('scenario').addEventListener('change',event=>{selectedScenario=Number(event.target.value);renderCash();});render();
</script>
