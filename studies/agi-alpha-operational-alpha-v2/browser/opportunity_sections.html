<section class="section" id="opportunity">
  <div class="section-heading"><div class="number">01</div><div><div class="eyebrow" data-en="An opportunity selected before construction" data-fr="Une occasion choisie avant la construction"></div><h2 data-en="Can this scientific model answer the new question?" data-fr="Ce modèle scientifique peut-il répondre à la nouvelle question ?"></h2><p class="lede" data-en="A research team wants to reuse a published model. The useful service is a reproducible qualification: what the source supports, what remains conditional, and which additional evidence is necessary." data-fr="Une équipe de recherche veut réutiliser un modèle publié. Le service utile est une qualification reproductible : ce que la source permet, ce qui reste conditionnel et les preuves supplémentaires nécessaires."></p></div></div>
  <div class="selected-opportunity"><div><span class="tag" data-en="S3 · selected computational pilot" data-fr="S3 · pilote computationnel retenu"></span><h3 data-en="Source-bound scientific-model reuse qualification" data-fr="Qualification de réutilisation scientifique liée aux sources"></h3><p data-en="For research software teams, core facilities and modeling services. Deliver executable calculations, a purpose-specific decision, a counterexample when needed, and an explicit evidence obligation. Preserve the valid original model." data-fr="Pour les équipes de logiciels scientifiques, plateformes et services de modélisation. Livrer des calculs exécutables, une décision propre à l’usage, un contre-exemple au besoin et une obligation de preuve explicite. Préserver le modèle original valide."></p><p class="small"><a href="../opportunity/SELECTION.json" data-en="Selection record" data-fr="Dossier de sélection"></a> · <a href="../opportunity/protocol/README.md" data-en="Prospective protocol" data-fr="Protocole prospectif"></a></p></div><div class="opportunity-ledger"><div><span data-en="Actual customer collections" data-fr="Encaissements clients réels"></span><strong>$0</strong></div><div><span data-en="Actual complete cost / profit" data-fr="Coût complet / profit réel"></span><strong data-en="Unknown" data-fr="Inconnus"></strong></div><div><span data-en="Observed commercial crossing" data-fr="Franchissement commercial observé"></span><strong>0</strong></div></div></div>
  <div class="grid two" style="margin-top:18px"><article class="card"><span class="tag sourced" data-en="Sourced problem · research hypothesis" data-fr="Problème sourcé · hypothèse de recherche"></span><h3 data-en="A documented integration direction" data-fr="Une piste d’intégration documentée"></h3><p data-en="PEtab Select identifies expensive identifiability analysis across model spaces and selective automation as a future direction. This motivates a bounded qualification instrument; it does not establish a buyer, a price, or an unserved market." data-fr="PEtab Select présente le coût de l’analyse d’identifiabilité dans les espaces de modèles et l’automatisation sélective comme piste future. Cela motive un instrument limité de qualification, sans établir un acheteur, un prix ou un marché mal desservi."></p><a class="small" href="https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1014774" data-en="Primary PEtab Select paper" data-fr="Publication primaire PEtab Select"></a></article><article class="card"><span class="tag" data-en="Purpose-preserving transformation" data-fr="Transformation préservant l’objectif"></span><h3 data-en="Separate executability from permission to infer" data-fr="Distinguer exécution et validité de l’inférence"></h3><p data-en="Bind the measurement regime, supplied parameters and requested quantity. Then compute a valid prediction or a checkable reason why more evidence is needed. Established algebra and a researcher-authored workflow perform the transformation." data-fr="Relier le régime de mesure, les paramètres fournis et la quantité demandée. Calculer ensuite une prédiction valide ou une raison vérifiable d’exiger d’autres preuves. L’algèbre établie et un processus conçu par les chercheurs réalisent cette transformation."></p></article></div>
  <details><summary data-en="Discovery history: six candidates deferred, then the narrower S3 follow-up" data-fr="Historique de découverte : six candidats différés, puis le suivi S3 plus ciblé"></summary><p class="note" data-en="The three tracks used bounded source research. Selection and the proposed instruments were investigator-directed, not autonomous market discoveries. Negative findings remain part of the evidence." data-fr="Les trois pistes ont fait l’objet de recherches documentaires limitées. La sélection et les instruments proposés ont été dirigés par les chercheurs, sans découverte autonome de marché. Les résultats négatifs restent conservés."></p><div class="table-wrap"><table id="discovery-table"><thead><tr><th data-en="Candidate" data-fr="Candidat"></th><th data-en="Why it did not clear the gate" data-fr="Pourquoi il n’a pas franchi le seuil"></th><th data-en="Evidence" data-fr="Preuves"></th></tr></thead><tbody></tbody></table></div></details>

<section class="section" id="inheritance">
  <div class="section-heading"><div class="number">04</div><div><h2 data-en="A successor inherits a procedure, not scientific authority" data-fr="Le successeur hérite d’une procédure, pas d’une autorité scientifique"></h2><p class="lede" data-en="The retained asset is a versioned executable qualification instrument. Source data, protected answers and customer secrets are excluded from its capsule. Every new purpose receives a fresh evidence binding." data-fr="L’actif conservé est un instrument exécutable et versionné de qualification. Sa capsule exclut données sources, réponses protégées et secrets clients. Chaque nouvel usage reçoit un lien de preuve propre."></p></div></div>
  <div class="lineage"><article class="card"><div class="step">01</div><h3 data-en="Published sources" data-fr="Sources publiées"></h3><p data-en="H4: actual model and equilibrium measurements. Boehm: a separate model family with finite observation times. Source files and notices remain separately pinned." data-fr="H4 : modèle réel et mesures d’équilibre. Boehm : famille distincte avec temps d’observation finis. Fichiers sources et notices restent figés séparément."></p></article><article class="card"><div class="step">02</div><h3 data-en="Research construction" data-fr="Construction de recherche"></h3><p data-en="scientific-model-reuse 1.0.0 packages inventory, stationary calculation, clock witness, dimension checks and fresh qualification. Unpaid R&D; established mathematics; no model-weight update." data-fr="scientific-model-reuse 1.0.0 réunit inventaire, calcul stationnaire, témoin d’horloge, bornes dimensionnelles et nouvelle qualification. R-D non rémunérée, mathématiques établies, aucun changement des poids du modèle."></p></article><article class="card"><div class="step">03</div><h3 data-en="Exact-byte receipt" data-fr="Réception des mêmes octets"></h3><p id="science-receipt"></p><p class="hash" id="capsule-hash"></p></article><article class="card"><div class="step">04</div><h3 data-en="Mission-specific reuse" data-fr="Réutilisation propre à la mission"></h3><p data-en="E+ uses the actual frozen functions. The H4 equilibrium witness stops at Boehm’s finite-time boundary. The new source, observation map, request and permissions must be rechecked." data-fr="E+ utilise les fonctions figées réelles. Le témoin d’équilibre H4 s’arrête à la frontière temporelle de Boehm. Il faut revérifier source, carte d’observation, demande et permissions."></p></article></div>
  <div class="grid two" style="margin-top:18px"><article class="card"><span class="tag" data-en="Observed local controls" data-fr="Contrôles locaux observés"></span><h3 id="science-native"></h3><p data-en="Existing encryption, lifecycle, rights, revocation, Jobs roles and accounting interfaces are preserved. Local membership fixtures are synthetic. The unchanged native software-workflow scope refuses production admission of this scientific capsule." data-fr="Les interfaces existantes de chiffrement, cycle de vie, droits, révocation, rôles Jobs et comptabilité sont préservées. Les identités locales sont synthétiques. Le périmètre logiciel natif inchangé refuse l’admission en production de cette capsule scientifique."></p></article><article class="card"><span class="tag unknown" data-en="Transfer boundary" data-fr="Limite du transfert"></span><h3 data-en="Equal library contents; graph premium = 0" data-fr="Bibliothèque au contenu identique; prime du graphe = 0"></h3><p data-en="An ordinary library receives the same bytes and permissions. Availability to authorized agents requires the actual protected network and current permissions; membership never grants blanket execution authority. Requalify after material changes." data-fr="Une bibliothèque ordinaire reçoit les mêmes octets et permissions. L’accès des agents autorisés exige le réseau protégé réel et des permissions à jour; l’appartenance ne donne jamais une autorité générale d’exécution. Requalifier après tout changement matériel."></p></article></div>
  <details><summary data-en="Executable scope and scientific limits" data-fr="Périmètre exécutable et limites scientifiques"></summary><p data-en="Dynamics support closed, irreducible, first-order one-to-one conversion networks, a constant unit-volume compartment, total-one initial state, constant parameters and one condition without overrides. Other SBML constructs require another qualified solver. No general PEtab compliance, model-fitting service, full identifiability proof or biological validation is provided." data-fr="La dynamique couvre les réseaux fermés, irréductibles, de conversions un-à-un du premier ordre, avec compartiment constant de volume unitaire, état initial de somme un, paramètres constants et une condition sans substitution. Les autres constructions SBML exigent un solveur qualifié distinct. Aucune conformité PEtab générale, prestation d’ajustement, preuve d’identifiabilité complète ou validation biologique n’est fournie."></p><p data-en="A declared time unit is not independent physical calibration. The fixed spectral zero threshold is 10⁻⁹; materially different rate scales require requalification. Numerical intervals are not certified outward-rounded interval arithmetic." data-fr="Une unité temporelle déclarée ne constitue pas une calibration physique indépendante. Le seuil spectral fixe de zéro est 10⁻⁹; des échelles de taux différentes exigent une requalification. Les intervalles numériques ne sont pas une arithmétique d’intervalles certifiée avec arrondi extérieur."></p></details>

sh after every recorded event, using the arbitrary $500 opening balance. Refundable deposits increase cash and liabilities equally. Earned release can finance later work only after acceptance, permitted use and remaining reserves." data-fr="Trésorerie disponible après chaque événement consigné, avec le solde initial arbitraire de 500 $. Les dépôts remboursables augmentent à parts égales liquidités et passif. Une libération acquise ne peut financer le travail ultérieur qu’après acceptation, usage permis et réserves restantes."></p></div>
  <div class="grid two" style="margin-top:18px"><article class="card"><span class="tag assumed" data-en="Zero-saving default · simulated" data-fr="Défaut sans économie · simulé"></span><h3 data-en="The selected plan uses conventional delivery" data-fr="Le plan retenu utilise la prestation conventionnelle"></h3><p id="arrangement-selected"></p><p id="arrangement-values"></p><p class="note" data-en="No quality uplift or adaptation saving is assigned to the new instrument. The unrestricted conventional entrepreneur has the same coordination, price and payment alternatives. Supplied scenario weights are not empirical probabilities." data-fr="Aucun gain de qualité ou d’adaptation n’est attribué au nouvel instrument. L’entrepreneur conventionnel sans restriction dispose des mêmes choix de coordination, prix et paiement. Les poids des scénarios fournis ne sont pas des probabilités empiriques."></p></article><article class="card"><span class="tag assumed" data-en="Fresh synthetic stress" data-fr="Stress synthétique nouveau"></span><h3 id="stress-heading"></h3><div id="stress-grid" class="stress-grid" role="img"></div><p class="note" data-en="Each square is one synthetic combination of failure, withdrawal, partial acceptance, default, refund and delay. Red records a loss; outlined squares record nonnegative contribution. This sample does not estimate a market loss rate." data-fr="Chaque carré est une combinaison synthétique d’échec, retrait, acceptation partielle, défaut, remboursement et délai. Le rouge indique une perte; les carrés à contour indiquent une contribution non négative. Cet échantillon n’estime pas un taux de perte du marché."></p></article></div>

  <div class="section-heading"><div class="number">06</div><div><h2 data-en="Choose the next action from its expected net value" data-fr="Choisir la prochaine action selon sa valeur nette attendue"></h2><p class="lede" data-en="Useful delivery, instrument construction and coordination are separate decisions. No mandatory reinvestment fraction or automatic admission follows from a successful demonstration." data-fr="Livraison utile, construction d’instrument et coordination sont des décisions distinctes. Aucune fraction obligatoire de réinvestissement ou admission automatique ne découle d’une démonstration réussie."></p></div></div>
  <div class="grid two"><article class="card"><span class="tag assumed" data-en="Optional HOLD supplement · simulated" data-fr="Supplément facultatif HOLD · simulé"></span><h3 data-en="Sometimes the productive choice is to keep operating" data-fr="Parfois, le choix productif est de poursuivre l’exploitation"></h3><p data-en="A disclosed post-primary extension adds HOLD to the original assessment menu. It preserves the original losses and then freezes the selection before fresh modeled worlds. All three optional policies choose HOLD, which actually runs established E." data-fr="Une extension déclarée après l’étude primaire ajoute HOLD au menu initial d’évaluation. Elle préserve les pertes initiales, puis fige le choix avant de nouveaux mondes simulés. Les trois politiques facultatives choisissent HOLD, qui exécute réellement E établi."></p><div class="metric" id="hold-increment"></div><p class="figure-label" data-en="Mean avoided modeled loss versus original shared policy, same fresh reference worlds" data-fr="Perte modélisée moyenne évitée face à la politique partagée initiale, mêmes mondes de référence nouveaux"></p><p class="small" id="hold-result"></p><p class="note" data-en="The interval describes the supplied simulation. This is avoided assessment expense and associated effects, not earned revenue from learning or evidence that sharing succeeded." data-fr="L’intervalle décrit la simulation fournie. Il s’agit de dépenses d’évaluation et d’effets associés évités, non de revenus gagnés grâce à l’apprentissage ni de preuve de succès du partage."></p><a href="../economics/value_README.md" class="small" data-en="HOLD methods, preserved history and fresh results" data-fr="Méthodes HOLD, historique conservé et résultats nouveaux"></a></article><article class="card"><h3 data-en="Operating blueprint for the next real commission" data-fr="Plan opérationnel pour la prochaine commande réelle"></h3><ol class="blueprint"><li><strong data-en="Sell a bounded reuse decision." data-fr="Vendre une décision de réutilisation délimitée."></strong><span data-en="Agree the useful quantity, source identity, acceptance, deadline, rights and customer effort. Obtain a scoped human-service quote or explicit buyer-value hypothesis." data-fr="Convenir de la quantité utile, des sources, de l’acceptation, du délai, des droits et de l’effort client. Obtenir un devis humain comparable ou une hypothèse explicite de valeur client."></span></li><li><strong data-en="Use the strongest adequate method." data-fr="Employer la meilleure méthode adéquate."></strong><span data-en="Allow conventional tools, ordinary model use and expert workflows. If a simpler method qualifies, do not force construction of the new instrument." data-fr="Autoriser outils conventionnels, usage ordinaire du modèle et méthodes expertes. Si une méthode simple convient, ne pas imposer la construction du nouvel instrument."></span></li><li><strong data-en="Count every incremental obligation once." data-fr="Compter chaque obligation supplémentaire une seule fois."></strong><span data-en="A: complete required delivery. B: additional assessment, retention and upkeep. C: optional further development. Reconcile actual costs and dated payments before profit or funding claims." data-fr="A : livraison complète requise. B : évaluation, conservation et entretien supplémentaires. C : développement facultatif additionnel. Réconcilier coûts réels et paiements datés avant toute affirmation de profit ou financement."></span></li><li><strong data-en="Retain and share only after evidence." data-fr="Conserver et partager après preuve."></strong><span data-en="Test fresh recipient benefit, permitted reuse and ordinary-library equivalence. Select production, assessment, training, sharing, holding cash or stopping prospectively." data-fr="Tester le bénéfice d’un nouveau destinataire, la réutilisation permise et l’équivalence avec une bibliothèque ordinaire. Choisir prospectivement production, évaluation, entraînement, partage, conservation de liquidités ou arrêt."></span></li></ol></article></div>
  <div class="result-strip"><strong data-en="The frontier is a hypothesis with a test, not booked revenue." data-fr="La frontière est une hypothèse testable, non une recette comptabilisée."></strong><span data-en="A new profitable offering requires fixed usefulness, quality, deadline, customer effort and price, positive complete-cost margin, and a matched baseline that fails within the same envelope. This campaign establishes no exclusive technical or observed commercial crossing." data-fr="Une nouvelle offre rentable exige utilité, qualité, délai, effort client et prix fixés, marge positive sur coût complet, et référence comparable qui échoue dans la même enveloppe. Cette campagne n’établit aucun franchissement technique exclusif ou commercial observé."></span></div>
  <p class="note" data-en="Live operation still needs buyer commitments, measured complete expense, mission-specific scientific acceptance, authorized access, actual payment terms and funded reserves. Applicable $AGIALPHA utility must follow implemented Jobs, governance and settlement authority. Token utility, legal classification, speculative valuation and enterprise cash profit remain separate. No live token settlement is demonstrated here." data-fr="L’exploitation réelle exige encore engagements d’acheteurs, coûts complets mesurés, acceptation scientifique propre à la mission, accès autorisé, conditions de paiement réelles et réserves financées. Toute utilité de $AGIALPHA doit respecter l’autorité Jobs, la gouvernance et le règlement implémentés. Utilité du jeton, qualification juridique, valorisation spéculative et profit monétaire restent distincts. Aucun règlement réel en jetons n’est démontré ici."></p>
