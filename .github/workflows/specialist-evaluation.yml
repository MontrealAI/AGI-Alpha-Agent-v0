# SPDX-License-Identifier: Apache-2.0
name: Specialist evaluation acceptance
on:
  push:
    paths: ['examples/specialist-evaluation/**', 'scripts/templates/specialist-evaluation/**', 'scripts/generate_specialist_evaluation.py', 'docs/successor/evaluate/**', 'docs/assets/successor/engine.mjs', 'tests/browser/test_specialist_evaluation_browser.py', 'tests/test_specialist_evaluation_delivery.py', '.github/workflows/specialist-evaluation.yml']
  pull_request:
    paths: ['examples/specialist-evaluation/**', 'scripts/templates/specialist-evaluation/**', 'scripts/generate_specialist_evaluation.py', 'docs/successor/evaluate/**', 'docs/assets/successor/engine.mjs', 'tests/browser/test_specialist_evaluation_browser.py', 'tests/test_specialist_evaluation_delivery.py', '.github/workflows/specialist-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Install pinned browser QA tools
        run: |
          python -m pip install playwright==1.54.0 pytest==8.4.1 pyyaml==6.0.2
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Validate exact contract and evidence boundaries
        run: |
          node --test examples/specialist-evaluation/engine.test.mjs examples/specialist-evaluation/app.test.mjs
          python -m pytest --noconftest -o addopts= tests/test_specialist_evaluation_delivery.py -q
          python scripts/generate_specialist_evaluation.py
          git diff --exit-code -- docs/successor/evaluate
      - name: Mandatory bilingual browser recovery and accessibility
        env:
          AXE_SCRIPT: tests/browser/node_modules/axe-core/axe.min.js
          EVALUATION_SCREENSHOTS: evidence/specialist-evaluation
        run: python tests/browser/test_specialist_evaluation_browser.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: specialist-evaluation-${{ github.sha }}
          path: evidence/specialist-evaluation/
          if-no-files-found: error
