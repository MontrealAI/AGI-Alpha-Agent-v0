# SPDX-License-Identifier: Apache-2.0
name: Anonymous immutable-paper headed reader probe
on:
  push:
    branches: ['evidence/anonymous-paper-headed-20261029']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headed-reader:
    if: github.ref == 'refs/heads/evidence/anonymous-paper-headed-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Headed anonymous WebDriver readback with real wall-time waits
        run: python -B -m scripts.verify_anonymous_paper_browser --output paper-headed-evidence
      - name: Preserve actual captures and safe diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: anonymous-paper-headed-${{ github.sha }}
          path: paper-headed-evidence/
          if-no-files-found: error
          retention-days: 30
