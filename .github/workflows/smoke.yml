name: "🔥 Smoke Test"

on:
  push:
    branches: [main, codex/alpha-agent-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_token:
        description: 'Authorization token for maintainers'
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  OPENAI_AGENTS_DISABLE_TRACING: "true"
  PYTHON_VERSION_MATRIX: "3.11,3.12,3.13"
  AGIALPHA_ADDRESS: "0xa61a3b3a130a9c20768eebf97e21515a6046a1fa"
  AGIALPHA_DECIMALS: 18

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check manual dispatch token
        if: github.event_name == 'workflow_dispatch' && github.actor != github.repository_owner && github.actor != 'github-actions[bot]'
        env:
          PROVIDED_TOKEN: ${{ inputs.run_token }}
          EXPECTED_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [[ -z "$EXPECTED_TOKEN" || "$PROVIDED_TOKEN" != "$EXPECTED_TOKEN" ]]; then
            echo "Unauthorized manual dispatch"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 'requirements.lock'

      - name: Verify $AGIALPHA configuration
        run: python scripts/check_agialpha_config.py

      - name: Isolate dependencies from hosted runner tools
        run: |
          python - <<'PYCODE'
          import os, venv
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'alpha-smoke-venv'
          venv.EnvBuilder(with_pip=True).create(root)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as target:
              target.write(str(root / ('Scripts' if os.name == 'nt' else 'bin')) + '\n')
          PYCODE

      - name: Install reproducible smoke dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==8.4.1 pytest-cov==6.2.1 eth-account==0.13.7
          python -m pip check
          python scripts/check_python_deps.py
          python check_env.py
      - name: Run focused smoke tests on every platform and Python version
        run: |
          mkdir -p evidence
          python -m pytest --noconftest -o addopts= tests/test_ping_agent.py tests/test_af_requests.py -q --junitxml=evidence/smoke.xml
      - name: Exercise the installed operator lifecycle
        run: |
          python -m pip install --no-deps .
          python -m pytest tests/runtime --confcutdir=tests/runtime -q --junitxml=evidence/runtime.xml
      - name: Run 2-year simulation
        run: |
          python -m alpha_factory_v1.demos.alpha_agi_insight_v1.src.interface.cli simulate \
            --horizon 2 --sectors 1 --pop-size 1 --generations 1 --offline --no-broadcast \
            | tee sim.log
          grep -qi "year" sim.log
          test -f "$AGI_INSIGHT_LEDGER_PATH"
        env:
          AGI_INSIGHT_LEDGER_PATH: ${{ runner.temp }}/audit.db
          AGI_INSIGHT_OFFLINE: "1"
          OPENAI_API_KEY: ""

      - name: Verify ledger output
        run: |
          python - <<'PYCODE'
          import os, sqlite3
          from pathlib import Path
          path = Path(os.environ['AGI_INSIGHT_LEDGER_PATH'])
          assert path.is_file(), path
          with sqlite3.connect(path) as db:
              assert db.execute('SELECT COUNT(*) FROM messages').fetchone()[0] > 0
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          PYCODE
        env:
          AGI_INSIGHT_LEDGER_PATH: ${{ runner.temp }}/audit.db
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: smoke-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            evidence/
            sim.log
          if-no-files-found: error

  smoke-result:
    name: Smoke matrix
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all nine platform and Python runs to succeed
        env:
          MATRIX_RESULT: ${{ needs.smoke.result }}
        run: test "$MATRIX_RESULT" = success
