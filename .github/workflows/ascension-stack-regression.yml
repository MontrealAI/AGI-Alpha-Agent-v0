# SPDX-License-Identifier: Apache-2.0
name: Ascension stack regression
on:
  push:
    branches:
      - feat/ascension-native-cycle-20261014
      - feat/ascension-inspectable-cycle-20261014
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ascension-stack-regression-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OPENAI_AGENTS_DISABLE_TRACING: 'true'
  NO_DISCLAIMER: '1'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact candidate before installing dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          mkdir -p evidence/ascension-stack
          git rev-parse HEAD > evidence/ascension-stack/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/ascension-stack/tree.txt
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > evidence/ascension-stack/run.txt
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Original locked development environment
        run: |
          python -m pip install 'pip<26'
          python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m pip install eth-account==0.13.7
          python scripts/check_python_deps.py
          python check_env.py --auto-install
          python -m pip check
          npm ci --prefix alpha_factory_v1/demos/alpha_agi_insight_v1/insight_browser_v1
          FETCH_ASSETS_SKIP_LLM=1 npm run build --prefix alpha_factory_v1/demos/alpha_agi_insight_v1/insight_browser_v1
          python -m playwright install --with-deps chromium
      - name: Verify deterministic legacy restart behavior
        run: |
          mkdir -p evidence
          # The full suite owns shared browser assets and cleans them after use.
          ALPHA_PYTEST_OWNER_PID=$$ python -m scripts.run_local_tests tests/test_orchestrator_backoff.py tests/test_insight_orchestrator_restart.py -q --junitxml=evidence/restarts.xml
      - name: Execute the complete catalog finite launch contracts
        run: python -m scripts.validate_demo_catalog --smoke --output evidence/demo-catalog.json
      - name: Full offline regression including notebooks
        run: |
          mkdir -p evidence
          python -m scripts.run_local_tests -q --cov --cov-config=pyproject.toml --cov-fail-under=80 --cov-report=xml:evidence/coverage.xml --junitxml=evidence/regression.xml
          cp .coverage evidence/coverage.data
      - name: Strict types and repository checks
        run: |
          python -m mypy --config-file mypy-runtime.ini
          python -m mypy --strict --follow-imports=skip scripts/release_packs.py scripts/check_successor_preservation.py scripts/successor_evidence.py
          python -m mypy --config-file mypy-business3.ini
          python -m mypy --config-file mypy-governance.ini
          python -m mypy --config-file mypy-discovery.ini
          python -m mypy --config-file mypy-experience.ini
          python -m mypy --config-file mypy-mats.ini
          python -m mypy --config-file mypy-curriculum.ini
          python -m mypy --config-file mypy-muzero.ini
          python -m mypy --config-file mypy-finance.ini
          python -m mypy --config-file mypy-sovereign.ini
          python -m mypy --config-file mypy.ini
          python scripts/ruff_targets.py --run
          python -m scripts.check_agent_preservation > evidence/preservation.json
          python -m scripts.check_successor_preservation --output evidence/successor-preservation.json
          python -m scripts.check_manuscript > evidence/manuscript.json
          python -m scripts.check_factory_readiness > evidence/factory-preservation.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: ascension-stack-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
