# SPDX-License-Identifier: Apache-2.0
name: SUCCESSOR capability workspace
on:
  pull_request:
    paths:
      - .github/workflows/successor-capability.yml
      - examples/successor-capability/**
      - examples/autonomous-enterprises/**
      - examples/successor-workbench/mission-store.mjs
      - docs/assets/successor/engine.mjs
      - docs/successor/capabilities/**
      - docs/alpha_factory_v1/demos/successor/capabilities/**
      - docs/discovery-lab/DEPLOYMENT_COMPATIBILITY.json
      - scripts/generate_successor_capability.py
      - scripts/run_local_tests.py
      - scripts/validate_discovery_lab.py
      - scripts/generate_gallery_html.py
      - scripts/templates/successor-capability/**
      - tests/browser/test_successor_capability_browser.py
      - tests/browser/test_autonomous_enterprises_browser.py
      - tests/browser/test_out_evolve_browser.py
      - tests/browser/test_discovery_lab_browser.py
      - tests/browser/test_out_execute_browser.py
      - tests/browser/out_evolve_recovery.py
      - tests/browser/test_successor_capability_accessibility.py
      - tests/test_successor_capability_delivery.py
      - tests/test_autonomous_enterprises_source.py
      - tests/test_paper_checkout_bytes.py
      - tests/test_discovery_lab_validation.py
      - tests/test_run_local_tests_environment.py
      - tests/browser/test_discovery_lab_continuation.py
      - tests/browser/fleet_receipt_native.mjs
      - tests/browser/fleet_module_boundary.mjs
      - tests/browser/fleet_module_boundary.test.mjs
      - tests/browser/fleet_git_metadata.mjs
      - tests/browser/fleet_git_metadata.test.mjs
  push:
    branches: [main, additive/successor-capability-review-20261020]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: capability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  paper-scope:
    uses: ./.github/workflows/paper-scope.yml

  capability:
    if: ${{ !cancelled() && success() && needs.paper-scope.outputs.mode == 'full' }}
    needs: paper-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Capture pinned public Fleet native review source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: MontrealAI/AGI-Fleet-Linux
          ref: 0dd352fdd2b1af00bc8358e0ac7f96682fd6f796
          path: .ci-fleet-discovery
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.17.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Bind retained evidence to exact source
        run: |
          mkdir -p capability-evidence/logs
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          source = json.loads((root / 'docs/successor/capabilities/sources.json').read_text())
          receipt = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'source': source,
                     'files': {path: hashlib.sha256((root / path).read_bytes()).hexdigest()
                               for path in source['sources']}}
          (root / 'capability-evidence/exact-checkout.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Install browser and accessibility tools
        run: |
          python -m pip install playwright==1.54.0 pytest==8.4.1 PyYAML==6.0.2 mypy==2.4.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Computation, history and delivery gates
        run: |
          set -o pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          held = [
              'tests/test_successor_capability_delivery.py::test_native_source_helper_refuses_unsafe_metadata_without_installing_or_running_commands',
              'tests/test_successor_capability_delivery.py::test_native_source_helper_refuses_non_admitted_worktree_metadata',
              'tests/test_successor_capability_delivery.py::test_native_browser_attack_bank_is_predeclared_and_not_selected_by_the_producer',
              'tests/test_successor_capability_delivery.py::test_both_native_requests_are_actual_ui_downloads_with_one_pre_fleet_history',
          ]
          record = {'schema': 'agialpha.held-test-selection.v1',
                    'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'invocation': 'capability-delivery', 'status': 'LOCAL_NOT_RUN', 'qualified': False,
                    'tests': [{'nodeid': node, 'status': 'LOCAL_NOT_RUN'} for node in held],
                    'meaning': 'These four held nodes are not run by this invocation; their outcomes are not qualified.'}
          pathlib.Path('capability-evidence/held-probes.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          node --test examples/successor-capability/*.test.mjs examples/autonomous-enterprises/*.test.mjs examples/successor-capability/out-execute/*.test.mjs tests/browser/successor_engine.test.mjs tests/browser/fleet_module_boundary.test.mjs tests/browser/fleet_git_metadata.test.mjs examples/successor-workbench/mission-record.test.mjs examples/successor-workbench/mission-app.test.mjs examples/successor-workbench/mission-workflow.test.mjs 2>&1 | tee capability-evidence/logs/node.log
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --noconftest -c /dev/null -p no:cacheprovider tests/test_run_local_tests_environment.py tests/test_discovery_lab_validation.py tests/test_autonomous_enterprises_source.py tests/test_paper_checkout_bytes.py tests/test_successor_capability_delivery.py -q \
            --deselect=tests/test_successor_capability_delivery.py::test_native_source_helper_refuses_unsafe_metadata_without_installing_or_running_commands \
            --deselect=tests/test_successor_capability_delivery.py::test_native_source_helper_refuses_non_admitted_worktree_metadata \
            --deselect=tests/test_successor_capability_delivery.py::test_native_browser_attack_bank_is_predeclared_and_not_selected_by_the_producer \
            --deselect=tests/test_successor_capability_delivery.py::test_both_native_requests_are_actual_ui_downloads_with_one_pre_fleet_history \
            2>&1 | tee capability-evidence/logs/delivery.log
      - name: Strict typing with retained actual output
        run: |
          set -o pipefail
          python -m mypy --version | tee capability-evidence/logs/typing-version.log
          python -m mypy --strict --config-file mypy.ini scripts/generate_successor_capability.py scripts/run_local_tests.py scripts/validate_discovery_lab.py tests/browser/test_discovery_lab_browser.py tests/browser/test_discovery_lab_continuation.py tests/test_discovery_lab_validation.py tests/test_run_local_tests_environment.py tests/browser/test_out_evolve_browser.py tests/browser/test_out_execute_browser.py tests/browser/out_evolve_recovery.py tests/browser/test_successor_capability_accessibility.py tests/test_autonomous_enterprises_source.py tests/test_paper_checkout_bytes.py tests/browser/test_autonomous_enterprises_browser.py 2>&1 | tee capability-evidence/logs/typing.log
      - name: Exact generated source and gallery cache
        run: |
          python scripts/generate_successor_capability.py
          python scripts/mirror_demo_pages.py
          python scripts/build_service_worker.py
          git diff --exit-code -- docs/successor/capabilities docs/alpha_factory_v1/demos/successor/capabilities docs/service-worker.js docs/assets/service-worker.js docs/alpha_factory_v1/demos/alpha_agi_insight_v1/service-worker.js
      - name: Browser journey, accessibility and durable recovery
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          CAPABILITY_SCREENSHOTS: ${{ github.workspace }}/capability-evidence
        run: |
          set -o pipefail
          python tests/browser/test_successor_capability_browser.py 2>&1 | tee capability-evidence/logs/v1-browser.log
      - name: Out-Evolve generated program, reuse and succession replay
        run: |
          set -o pipefail
          node examples/successor-capability/replay.mjs capability-evidence/out-evolve 2>&1 | tee capability-evidence/logs/replay.log
      - name: Out-Evolve browser journey and recovery
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          OUT_EVOLVE_EVIDENCE: ${{ github.workspace }}/capability-evidence/out-evolve-browser
        run: |
          set -o pipefail
          python tests/browser/test_out_evolve_browser.py 2>&1 | tee capability-evidence/logs/out-evolve-browser.log
      - name: Out-Execute bounded computation and browser history
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          OUT_EXECUTE_EVIDENCE: ${{ github.workspace }}/capability-evidence/out-execute-browser
        run: |
          set -o pipefail
          node examples/successor-capability/out-execute/reproduce.mjs capability-evidence/out-execute-study 4 2>&1 | tee capability-evidence/logs/out-execute-study.log
          python tests/browser/test_out_execute_browser.py 2>&1 | tee capability-evidence/logs/out-execute-browser.log
      - name: Connected Discovery Lab replay and browser acceptance
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          DISCOVERY_LAB_EVIDENCE: ${{ github.workspace }}/capability-evidence/discovery-lab-browser
          DISCOVERY_LAB_REPLAY_EVIDENCE: ${{ runner.temp }}/discovery-lab-replay
        run: |
          set -o pipefail
          node examples/successor-capability/discovery-lab-reproduce.mjs --output "$DISCOVERY_LAB_REPLAY_EVIDENCE" 2>&1 | tee capability-evidence/logs/discovery-lab-replay.log
          python -m scripts.validate_discovery_lab --site docs --output capability-evidence/discovery-lab-browser 2>&1 | tee capability-evidence/logs/discovery-lab-browser.log
      - name: Saved future-task protocol, docket and real-task boundary acceptance
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          DISCOVERY_CONTINUATION_EVIDENCE: ${{ github.workspace }}/capability-evidence/discovery-continuation
          DISCOVERY_FLEET_ROOT: ${{ github.workspace }}/.ci-fleet-discovery
          DISCOVERY_FLEET_REQUIRED: '1'
        run: |
          set -o pipefail
          python tests/browser/test_discovery_lab_continuation.py 2>&1 | tee capability-evidence/logs/discovery-continuation-browser.log
      - name: Autonomous Enterprises foundry, future tasks and canonical docket
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          ENTERPRISE_BROWSER_EVIDENCE: ${{ github.workspace }}/capability-evidence/autonomous-enterprises
        run: |
          set -o pipefail
          python tests/browser/test_autonomous_enterprises_browser.py 2>&1 | tee capability-evidence/logs/autonomous-enterprises-browser.log
      - name: Review ARIA and every contrast incomplete
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          CAPABILITY_ACCESSIBILITY_EVIDENCE: ${{ github.workspace }}/capability-evidence/accessibility-review
        run: |
          set -o pipefail
          python tests/browser/test_successor_capability_accessibility.py 2>&1 | tee capability-evidence/logs/accessibility-review.log
      - name: Collect external Discovery Lab replay output
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/discovery-lab-replay" ]; then
            cp -a "$RUNNER_TEMP/discovery-lab-replay" capability-evidence/discovery-lab
          fi
      - name: Retain exact-source screenshots and journey evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: successor-capability-${{ github.sha }}
          path: capability-evidence/
          if-no-files-found: error
