# SPDX-License-Identifier: Apache-2.0
name: Prepare verified v1.3.0 generated assets
on:
  push:
    branches: [release/prepare-1.3.0-assets]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FETCH_ASSETS_SKIP_LLM: '1'
      FETCH_ASSETS_DIR: ${{ runner.temp }}/insight-assets
      INSIGHT_ASSET_ROOT: ${{ runner.temp }}/insight-assets
      BROWSER_DIR: alpha_factory_v1/demos/alpha_agi_insight_v1/insight_browser_v1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/agent-integration-completion
      - name: Require the reviewed source commit
        run: test "$(git rev-parse HEAD)" = "8d1668d4ee92c6ad1ad53e1ce5d6fd4e206f4d3c"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Build the exact locked browser
        run: |
          npm ci --prefix "$BROWSER_DIR"
          npm run build:dist --prefix "$BROWSER_DIR"
      - name: Preserve and synchronize generated documentation
        run: |
          rsync -a --exclude='*.wasm' --exclude='*.zip' --exclude='*.gz' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' --exclude='*.gif' --exclude='*.pdf' --exclude='*.ico' --exclude='*.mp3' --exclude='*.mp4' --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.bin' --exclude='*.onnx' --exclude='*.exe' --exclude='*.dll' --exclude='*.so' --exclude='*.dylib' --exclude='assets/wasm/**' --exclude='assets/wasm_llm/**' --exclude='assets/pyodide/**' "$BROWSER_DIR/dist/" docs/alpha_agi_insight_v1/
          git add docs/alpha_agi_insight_v1 "$BROWSER_DIR/index.html"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Regenerate the preserved Insight documentation from locked v1.3.0 sources"
          git push origin HEAD:fix/agent-integration-completion
          git rev-parse HEAD
