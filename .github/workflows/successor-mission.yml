name: SUCCESSOR mission recovery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.17.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pinned browser tools
        # Native-return browser checks use the existing hash-locked journal/export runtime with execution doubles.
        run: |
          python -m pip install playwright==1.54.0 PyYAML==6.0.2 pytest==8.4.1
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Strict records and existing workbench
        run: |
          node --test examples/successor-alpha/*.test.mjs
          python tests/test_successor_alpha_delivery.py
          node --test examples/successor-workbench/mission-record.test.mjs examples/successor-workbench/mission-app.test.mjs examples/successor-workbench/mission-workflow.test.mjs
          node examples/successor-workbench/test.mjs
          node --test examples/successor-project/engine.test.mjs examples/successor-project/journey-native.test.mjs
          python tests/test_successor_project_delivery.py
          python tests/test_guided_project_delivery.py
          node --test examples/alpha-discovery/engine.test.mjs examples/alpha-discovery/draft.test.mjs
          node --test examples/specialist-evaluation/engine.test.mjs examples/specialist-evaluation/app.test.mjs
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --noconftest -c /dev/null -p no:cacheprovider tests/test_native_browser_ci.py tests/test_specialist_evaluation_delivery.py tests/test_successor_alpha_validation.py tests/test_successor_alpha_release.py tests/test_successor_alpha_release_gate.py tests/test_deployment_cache.py -q
      - name: Generated source is current
        run: |
          python scripts/generate_successor_alpha.py
          python scripts/generate_alpha_discovery.py
          python scripts/generate_specialist_evaluation.py
          python scripts/generate_successor_mission.py
          python scripts/generate_successor_workbench.py
          python scripts/build_service_worker.py
          git diff --exit-code -- docs/successor docs/service-worker.js docs/assets/service-worker.js docs/alpha_factory_v1/demos/alpha_agi_insight_v1/service-worker.js alpha_factory_v1/core/runtime/successor
      - name: Atomic storage and full browser recovery
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          DISCOVERY_SCREENSHOTS: ${{ github.workspace }}/discovery-screenshots
          PROJECT_SCREENSHOTS: ${{ github.workspace }}/discovery-screenshots/project
          GUIDED_SCREENSHOTS: ${{ github.workspace }}/discovery-screenshots/guided
          EVALUATION_SCREENSHOTS: ${{ github.workspace }}/discovery-screenshots/evaluation
          SUCCESSOR_ALPHA_SCREENSHOTS: ${{ github.workspace }}/discovery-screenshots/alpha
        run: |
          python tests/browser/test_successor_alpha_browser.py
          python tests/browser/test_successor_mission_store.py
          python tests/browser/test_successor_mission_browser.py
          python tests/browser/test_alpha_discovery_browser.py
          python tests/browser/test_specialist_evaluation_browser.py
          python tests/browser/test_successor_project_browser.py
          python tests/browser/test_guided_successor_browser.py
      - name: Retain discovery browser screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: alpha-discovery-browser-${{ github.sha }}
          path: discovery-screenshots/
          if-no-files-found: error

  guided-cross-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.21.0'
      - name: Read reviewed exact Fleet source pin
        id: fleet-source
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('examples/successor-project/vendor/provenance.json')); if(!/^[a-f0-9]{40}$/.test(p.sources.fleet.commit)||p.sources.fleet.publication!=='published-exact-source')process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+p.sources.fleet.commit+'\n');"
      - name: Fetch exact Fleet runtime source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: MontrealAI/AGI-Fleet-Linux
          ref: ${{ steps.fleet-source.outputs.commit }}
          path: build/guided-fleet-source
          persist-credentials: false
      - name: Install locked Fleet runtime dependencies
        run: npm ci --prefix build/guided-fleet-source/fleet --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Actual bounded work, grants, internal check and changed-input continuation
        env:
          GUIDED_FLEET_SOURCE: ${{ github.workspace }}/build/guided-fleet-source
        run: node --test examples/successor-project/journey.test.mjs examples/successor-project/source-immutability.test.mjs
