name: SUCCESSOR mission recovery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Strict records and existing workbench
        run: |
          node --test examples/successor-workbench/mission-record.test.mjs examples/successor-workbench/mission-app.test.mjs
          node examples/successor-workbench/test.mjs
      - name: Generated source is current
        run: |
          python scripts/generate_successor_mission.py
          python scripts/generate_successor_workbench.py
          python scripts/build_service_worker.py
          git diff --exit-code -- docs/successor docs/service-worker.js docs/assets/service-worker.js docs/alpha_factory_v1/demos/alpha_agi_insight_v1/service-worker.js alpha_factory_v1/core/runtime/successor
      - name: Atomic storage and full browser recovery
        env:
          AXE_SCRIPT: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
        run: |
          python tests/browser/test_successor_mission_store.py
          python tests/browser/test_successor_mission_browser.py
