# SPDX-License-Identifier: Apache-2.0
name: Preserve initial model runner diagnostics
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy and verify the original failed job evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import datetime, hashlib, json, pathlib, subprocess, zipfile
          repo = "MontrealAI/AGI-Alpha-Agent-v0"
          folder = pathlib.Path("first-model-attempt")
          folder.mkdir()
          def fetch(path):
              return subprocess.check_output(["gh", "api", "--allow-escape-sequences", f"repos/{repo}/{path}"])
          job = json.loads(fetch("actions/jobs/108335557405"))
          artifact = json.loads(fetch("actions/artifacts/10897003736"))
          assert job["conclusion"] == "failure"
          assert job["head_sha"] == "845a8b26adadcb83219436d62861afc4a6b97f78"
          assert artifact["name"] == "real-model"
          data = fetch("actions/artifacts/10897003736/zip")
          digest = "sha256:" + hashlib.sha256(data).hexdigest()
          assert digest == artifact["digest"] == "sha256:22eaf12047eb2baa7b272ec55ea5ac656f4a1237e6dc4a836989a5076fc733b7"
          (folder / "original-real-model.zip").write_bytes(data)
          logs = fetch("actions/jobs/108335557405/logs")
          assert b"SandboxUnavailable" in logs and b"host execution is forbidden" in logs
          (folder / "original-job.log").write_bytes(logs)
          (folder / "original-job.json").write_text(json.dumps(job, indent=2) + "\n")
          (folder / "original-artifact.json").write_text(json.dumps(artifact, indent=2) + "\n")
          with zipfile.ZipFile(folder / "original-real-model.zip") as archive:
              assert archive.namelist() == ["sandbox-image.txt"], archive.namelist()
              sandbox = archive.read("sandbox-image.txt").decode().strip()
          report = {
              "captured_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "commit": job["head_sha"],
              "original_run": job["run_id"],
              "original_job": job["id"],
              "original_artifact": artifact["id"],
              "artifact_sha256": digest,
              "log_sha256": hashlib.sha256(logs).hexdigest(),
              "sandbox_image": sandbox,
              "reason": "Docker availability probe failed closed after the image pull; host execution was refused.",
              "passed": True,
          }
          (folder / "preservation.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2), flush=True)
          PYTHON
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: original-model-failure-152
          path: first-model-attempt/
          if-no-files-found: error
