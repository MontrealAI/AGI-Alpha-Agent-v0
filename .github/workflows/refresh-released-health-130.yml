name: Release verification checkpoint
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions: {}
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record pending final release verification
        run: |
          echo 'Superseded candidate stopped; temporary actions-write permission removed.'
          echo 'Final commit: 4f77ca26e578a7efd5da5f4f9e43fdbcd12b6564.'
          echo 'Publication and independent verification are still pending; this is not acceptance evidence.'
