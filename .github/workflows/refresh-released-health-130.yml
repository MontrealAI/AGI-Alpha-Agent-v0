# SPDX-License-Identifier: Apache-2.0
name: Prepare and validate CI Health badge patch
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FETCH_ASSETS_SKIP_LLM: '1'
      CYPRESS_INSTALL_BINARY: '0'
      PATCH_BRANCH: fix/ci-health-badge-1.5.2
      EXPECTED_HEAD: dba7e25888b0628a68acf8e33cbd544d5529611e
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dba7e25888b0628a68acf8e33cbd544d5529611e
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Install the established validation environment
        run: |
          bash scripts/ci_install_python_baseline.sh --include-docs-lock
          python scripts/check_python_deps.py
          python check_env.py --auto-install
          npm ci --prefix alpha_factory_v1/demos/alpha_agi_insight_v1/insight_browser_v1
      - name: Regenerate, validate and commit only the patch branch documentation
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$PATCH_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          mkdir -p evidence
          python scripts/generate_gallery_html.py
          python scripts/mirror_demo_pages.py
          python scripts/build_service_worker.py
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/agent-152-site"
          python -m scripts.check_agent_preservation | tee evidence/preservation.json
          git diff --check
          test -z "$(git diff --name-only --diff-filter=D)"
          git add -u docs
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[alpha_factory] Regenerate the versioned 1.5.2 gallery and offline caches'
          git push origin "HEAD:refs/heads/$PATCH_BRANCH"
          git rev-parse HEAD | tee evidence/commit.txt
      - name: Require the full repository hooks and focused preservation tests
        run: |
          pre-commit run --all-files | tee evidence/precommit-all.txt
          git diff --name-only -z 4f77ca26e578a7efd5da5f4f9e43fdbcd12b6564 HEAD | xargs -0 pre-commit run --files
          git diff --exit-code
          python scripts/check_python_deps.py
          python -m pytest --noconftest -o addopts= tests/test_readme_preservation.py -q --junitxml=evidence/preservation-tests.xml
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: badge-152-preflight
          path: evidence/
          if-no-files-found: error
