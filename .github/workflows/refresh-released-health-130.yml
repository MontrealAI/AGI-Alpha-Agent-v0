# SPDX-License-Identifier: Apache-2.0
name: Verify generated 1.5.2 source assets
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 3cdcb72f88311bcf8399ef62372a625b7283894a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Require canonical generated bytes and every offline asset
        run: |
          python scripts/generate_gallery_html.py
          python scripts/mirror_demo_pages.py
          python scripts/build_service_worker.py
          git diff --exit-code
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          docs = pathlib.Path('docs')
          worker = (docs / 'service-worker.js').read_text()
          assets = json.loads(worker.split('const ASSETS = ', 1)[1].split(';\n', 1)[0])
          missing = [name for name in assets if not (docs / name).is_file()]
          assert not missing, missing
          expected = 'docs/alpha_factory_v1/demos/ascension/index.html'
          subprocess.run(['git', 'ls-files', '--error-unmatch', expected], check=True)
          report = {'passed': True, 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'assets': len(assets), 'all_assets_present': True, 'canonical_generated_bytes': True, 'tracked_ascension_mirror': expected}
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/generated-assets.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: generated-152-assets
          path: evidence/
          if-no-files-found: error
