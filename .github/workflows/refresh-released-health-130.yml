# SPDX-License-Identifier: Apache-2.0
name: Configure Pages through the connected repository
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: read
  pages: write
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Actions publishing with the existing repository token
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Verify the resulting Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/MontrealAI/AGI-Alpha-Agent-v0/pages --jq '{html_url, build_type, status, https_enforced}'
