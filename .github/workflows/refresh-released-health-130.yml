# SPDX-License-Identifier: Apache-2.0
name: Inspect Pages publishing configuration
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current settings and public response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh api repos/MontrealAI/AGI-Alpha-Agent-v0/pages > evidence/pages.json || true
          curl -sSL -D evidence/headers.txt --max-time 60 https://montrealai.github.io/AGI-Alpha-Agent-v0/ -o evidence/index.html
          cat evidence/pages.json
          cat evidence/headers.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pages-current-configuration
          path: evidence/
