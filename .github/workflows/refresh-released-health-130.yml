# SPDX-License-Identifier: Apache-2.0
name: Verify live badge sources
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: read
  actions: read
jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live badge sources with GitHub Actions evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import concurrent.futures
          import json
          import pathlib
          import subprocess
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          repo = "MontrealAI/AGI-Alpha-Agent-v0"
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))
          expected = "616be2c942f72f3c86bdda8a9f9df958938ba1e1"
          assert api("git/ref/heads/main")["object"]["sha"] == expected
          workflows = ["pr-ci.yml", "ci.yml", "smoke.yml", "ci-health.yml", "agent-release.yml"]
          evidence = {}
          for workflow in workflows:
              runs = api(f"actions/workflows/{workflow}/runs?branch=main&per_page=10")["workflow_runs"]
              run = runs[0]
              assert run["head_sha"] == expected and run["conclusion"] == "success", run
              evidence[workflow] = {"run": run["html_url"], "sha": run["head_sha"], "conclusion": run["conclusion"]}
          folder = pathlib.Path("badge-evidence")
          folder.mkdir()
          def probe(workflow):
              url = f"https://img.shields.io/github/actions/workflow/status/{repo}/{workflow}?branch=main"
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read()
              (folder / f"{workflow}.svg").write_bytes(data)
              title = ET.fromstring(data).findtext("{http://www.w3.org/2000/svg}title")
              return workflow, {"url": url, "title": title}
          badges = dict(concurrent.futures.ThreadPoolExecutor(max_workers=5).map(probe, workflows))
          release_url = f"https://img.shields.io/github/v/release/{repo}"
          with urllib.request.urlopen(release_url, timeout=30) as response:
              data = response.read()
          release_title = ET.fromstring(data).findtext("{http://www.w3.org/2000/svg}title")
          (folder / "release.svg").write_bytes(data)
          report = {"commit": expected, "workflows": evidence, "badges": badges, "release_badge": release_title}
          (folder / "report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2), flush=True)
          assert all(v["title"].endswith(": passing") for v in badges.values()), badges
          assert "v1.3.0" in release_title, release_title
          PYTHON
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: live-badge-source-evidence
          path: badge-evidence/
          if-no-files-found: warn
