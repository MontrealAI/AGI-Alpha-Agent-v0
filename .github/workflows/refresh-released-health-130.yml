# SPDX-License-Identifier: Apache-2.0
name: Hold superseded Ascension release candidate
on:
  push:
    branches: [release/refresh-ci-health-1.3.0]
permissions:
  contents: read
  actions: write
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Stop publication from the commit with the verified generated-asset mismatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json, subprocess
          repo = "MontrealAI/AGI-Alpha-Agent-v0"
          run_id = "36197653458"
          run = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/actions/runs/{run_id}"], text=True))
          assert run["head_sha"] == "b98561e4ff834449009134839750d8f63c7c824b"
          assert run["name"] == "Agent release acceptance"
          if run["status"] != "completed":
              subprocess.run(["gh", "api", "--method", "POST", f"repos/{repo}/actions/runs/{run_id}/cancel"], check=True)
          print(json.dumps({"held_run": run_id, "head": run["head_sha"], "reason": "Generated Insight navigation must match its source before publication."}))
          PYTHON
