# SPDX-License-Identifier: Apache-2.0
name: Nova-Seed Studio acceptance
on:
  pull_request:
    paths:
      - 'docs/assets/nova-studio/**'
      - 'docs/assets/ascension-wallet/**'
      - 'docs/ascension/mainnet/**'
      - 'scripts/*nova*'
      - 'scripts/build_mark_wallet.py'
      - 'tests/nova-studio/**'
      - 'tests/contracts/**'
      - '.github/workflows/nova-studio.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pinned operator and browser test tools
        run: |
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/contracts
          npm ci --prefix tests/browser --ignore-scripts
      - name: Compiler, capsule, publication and adversarial workflow checks
        run: |
          node --test tests/nova-studio/*.test.mjs
          python -m unittest discover -s tests/nova-studio -p 'test_*.py' -v
      - name: Current-source contract and cross-language parity
        working-directory: tests/contracts
        run: npx hardhat test test/ascension/nova-plan-parity.test.js test/ascension/nova-studio.test.js
      - name: Actual browser preparation, recovery and accessibility
        run: python -m scripts.validate_nova_studio --output evidence/nova-studio-browser
      - name: Actual browser to disposable current-source EVM
        run: python -m scripts.validate_nova_studio_evm --output evidence/nova-studio-evm
      - name: Preserve production policy and deployment archive
        run: |
          git diff --exit-code -- contracts deployments docs/assets/ascension-wallet/build-profile.mjs
          npm run mainnet:record-check --prefix tests/contracts
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: nova-studio-browser
          path: evidence/nova-studio-browser/
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: nova-studio-evm
          path: evidence/nova-studio-evm/
          if-no-files-found: error
