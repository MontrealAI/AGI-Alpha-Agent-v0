# SPDX-License-Identifier: Apache-2.0
name: Materialize original study source
on:
  push:
    branches: [docs/try-work-evidence-pilot-20261014]
    paths: ['.publication-import/**', 'scripts/import_study_source_once.py', '.github/workflows/import-study-source.yml']
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'MontrealAI/AGI-Alpha-Agent-v0' && github.ref == 'refs/heads/docs/try-work-evidence-pilot-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify and unpack the exact source subset
        run: python scripts/import_study_source_once.py
      - name: Replace transport with reviewable plaintext
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .publication-import/part*.txt scripts/import_study_source_once.py .github/workflows/import-study-source.yml
          git add studies/computer-use/2026-10-14
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: retain verified original study sources as inspectable plaintext'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:docs/try-work-evidence-pilot-20261014
