# SPDX-License-Identifier: Apache-2.0
name: "📚 Docs"

on:
  workflow_dispatch:

# The manual entry point uses the same tested artifact and release gates as a
# main push. Pages publishing must not race a separate gh-pages branch build.
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ensure-owner

  build-deploy:
    needs: authorize
    uses: ./.github/workflows/agent-release.yml
    secrets: inherit
