# SPDX-License-Identifier: Apache-2.0
name: "📚 Docs"

on:
  workflow_dispatch:

# The manual entry point uses the same tested artifact and release gates as a
# main push. Pages publishing must not race a separate gh-pages branch build.
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    uses: ./.github/workflows/agent-release.yml
    secrets: inherit
