# SPDX-License-Identifier: Apache-2.0
name: Classify paper scope
on:
  workflow_call:
    outputs:
      mode:
        description: paper/editorial scope only after trusted history and passive checks; full otherwise
        value: ${{ jobs.classify.outputs.mode }}
permissions:
  contents: read
jobs:
  classify:
    name: Validate paper scope (not runtime acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Prove exact introduced history with the pre-change policy
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          policy="$RUNNER_TEMP/paper-policy"
          mkdir -p "$policy/scripts"
          # Dispatches, merges without a bounded base and first-time installation
          # deliberately take the full lane. Never execute policy from the upload.
          if [[ "$EVENT" != push && "$EVENT" != pull_request ]] || [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in scripts/paper_changes.py scripts/release_plan.py scripts/check_editorial_docs.py scripts/research_papers.py scripts/build_service_worker.py requirements-papers.lock requirements-editorial-docs.lock; do
            if ! git --no-replace-objects show "$BASE:$file" > "$policy/$file"; then
              echo 'mode=full' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          touch "$policy/scripts/__init__.py"
          cd "$policy"
          python scripts/paper_changes.py --root "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" --output scope.json
          if python -c 'import json; raise SystemExit(json.load(open("scope.json"))["mode"] != "paper")'; then
            python -m pip install --require-hashes --only-binary=:all: -r requirements-papers.lock
            python -m scripts.research_papers --root "$GITHUB_WORKSPACE" check
            if python -c 'import json; p=json.load(open("scope.json")); raise SystemExit(not any("docs/CHANGELOG.md" in row["paths"] for row in p["transitions"]))'; then
              python -m pip install --require-hashes --only-binary=:all: -r requirements-editorial-docs.lock
              python -m scripts.check_editorial_docs --root "$GITHUB_WORKSPACE" --scope scope.json
            fi
            echo 'Scope: proved paper/editorial inputs only; NO new software qualification.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Scope: full software qualification required.' >> "$GITHUB_STEP_SUMMARY"
          fi
