name: "✅ PR CI"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  AGIALPHA_ADDRESS: "0xa61a3b3a130a9c20768eebf97e21515a6046a1fa"
  AGIALPHA_DECIMALS: 18

jobs:
  paper-scope:
    uses: ./.github/workflows/paper-scope.yml

  lint:
    if: ${{ !cancelled() && success() && needs.paper-scope.outputs.mode == 'full' }}
    needs: paper-scope
    name: "Full lint (ruff)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Free disk space
        run: bash scripts/ci_free_disk.sh
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Verify $AGIALPHA configuration
        run: python scripts/check_agialpha_config.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
      - name: Ruff check
        run: python scripts/ruff_targets.py --run

  smoke:
    name: "Full smoke tests"
    if: ${{ !cancelled() && needs.paper-scope.outputs.mode == 'full' && (!cancelled()) }}
    needs: [paper-scope, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Free disk space
        run: bash scripts/ci_free_disk.sh
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Verify $AGIALPHA configuration
        run: python scripts/check_agialpha_config.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.lock
      - name: Run smoke tests
        run: |
          pytest -m smoke \
            tests/test_af_requests.py \
            tests/test_cache_version.py \
            tests/test_check_env_core.py \
            tests/test_check_env_network.py \
            tests/test_config_settings.py \
            tests/test_config_utils.py \
            tests/test_eslint_install_guard.py \
            tests/test_ping_agent.py -q
      - name: Verify every catalog entry and its finite launch contract
        run: |
          python -m scripts.sync_demo_catalog_docs --check
          python -m scripts.run_local_tests \
            tests/test_demo_inventory_docs.py tests/test_demo_validation_report.py \
            tests/test_generate_demo_docs.py tests/test_generate_gallery_html.py \
            tests/test_demo_catalog_regressions.py tests/runtime/test_demo_launcher.py \
            tests/test_demo_quality.py -q
          python -m scripts.validate_demo_catalog --smoke --output evidence/demo-catalog.json
      - name: Retain catalog acceptance evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr-demo-catalog
          path: evidence/demo-catalog.json
          if-no-files-found: warn

  full-software-qualification:
    name: Full software qualification
    needs: [paper-scope, lint, smoke, lint-result, smoke-result]
    if: ${{ !cancelled() && needs.paper-scope.outputs.mode == 'full' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind full-runtime scope to successful exact-source jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: row['result'] for name, row in results.items() if row['result'] != 'success'}
          if failed:
              raise SystemExit(f'Full software qualification incomplete: {failed}')
          print('Full software qualification, not paper-only validation.')
          PYTHON

  lint-result:
    name: "Lint (ruff)"
    # Required legacy context must fail, not skip-success, if scope validation fails.
    if: ${{ always() }}
    needs: [paper-scope, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require validated paper scope or successful full software checks
        env:
          SCOPE_RESULT: ${{ needs.paper-scope.result }}
          SCOPE_MODE: ${{ needs.paper-scope.outputs.mode }}
          FULL_RESULT: ${{ needs.lint.result }}
        run: |
          python - <<'PYTHON'
          import os
          scope, mode, full = (os.environ[key] for key in ('SCOPE_RESULT', 'SCOPE_MODE', 'FULL_RESULT'))
          if scope != 'success' or mode not in {'paper', 'full'} or mode == 'full' and full != 'success':
              raise SystemExit(f'Unqualified check: scope={scope}, mode={mode}, full={full}')
          message = 'Paper-only validation; NOT full runtime acceptance.' if mode == 'paper' else 'Full software check passed.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(message + '\n')
          PYTHON

  smoke-result:
    name: "Smoke tests"
    # Required legacy context must fail, not skip-success, if scope validation fails.
    if: ${{ always() }}
    needs: [paper-scope, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require validated paper scope or successful full software checks
        env:
          SCOPE_RESULT: ${{ needs.paper-scope.result }}
          SCOPE_MODE: ${{ needs.paper-scope.outputs.mode }}
          FULL_RESULT: ${{ needs.smoke.result }}
        run: |
          python - <<'PYTHON'
          import os
          scope, mode, full = (os.environ[key] for key in ('SCOPE_RESULT', 'SCOPE_MODE', 'FULL_RESULT'))
          if scope != 'success' or mode not in {'paper', 'full'} or mode == 'full' and full != 'success':
              raise SystemExit(f'Unqualified check: scope={scope}, mode={mode}, full={full}')
          message = 'Paper-only validation; NOT full runtime acceptance.' if mode == 'paper' else 'Full software check passed.'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(message + '\n')
          PYTHON
