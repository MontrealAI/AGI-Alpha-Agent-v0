# SPDX-License-Identifier: Apache-2.0
name: Work evidence kit
on:
  push:
    branches: [docs/try-work-evidence-pilot-20261014]
    paths: ['studies/computer-use/2026-10-14/**', '.github/workflows/work-evidence-kit.yml']
  pull_request:
    branches: [main]
    paths: ['studies/computer-use/2026-10-14/**', '.github/workflows/work-evidence-kit.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: work-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'push' && github.repository == 'MontrealAI/AGI-Alpha-Agent-v0' && github.ref == 'refs/heads/docs/try-work-evidence-pilot-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Format new tooling without changing the original fixture sources
        run: |
          python -m pip install ruff==0.12.9
          python -m ruff format studies/computer-use/2026-10-14/*.py
          python -m ruff check studies/computer-use/2026-10-14/*.py
      - name: Build exact applications and offline reader
        run: python studies/computer-use/2026-10-14/build_kit.py
      - name: Commit only generated study source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add studies/computer-use/2026-10-14
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: build exact study deliverables and the offline reader'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:docs/try-work-evidence-pilot-20261014
  validate:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install version-pinned, study-only browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('BROWSER_EXECUTABLE='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Build, replay and check real HTTP and local-file behavior
        run: |
          KIT=studies/computer-use/2026-10-14
          mkdir -p "$RUNNER_TEMP/study-dist"
          python "$KIT/build_kit.py" --output "$RUNNER_TEMP/study-dist/work-evidence-kit.zip"
          python "$KIT/verify_and_replay.py" --output "$RUNNER_TEMP/fresh-study"
          python "$KIT/validate_publication.py" --output "$RUNNER_TEMP/publication-checks"
          python "$KIT/check_negative_controls.py" --replay "$RUNNER_TEMP/fresh-study"
          git rev-parse HEAD > "$RUNNER_TEMP/publication-checks/SOURCE_COMMIT.txt"
          python - <<'PY'
          import hashlib,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); dist=root/'study-dist'
          with zipfile.ZipFile(dist/'fresh-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder,prefix in [(root/'fresh-study'/'03_Evidence','replay'),(root/'publication-checks','publication')]:
                  for p in sorted(folder.rglob('*')):
                      if p.is_file():z.write(p,prefix+'/'+p.relative_to(folder).as_posix())
              z.write(root/'fresh-study'/'FRESH_RESULTS.json','FRESH_RESULTS.json')
          (dist/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(dist.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: work-evidence-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/study-dist/
          if-no-files-found: error
  publish-preview:
    needs: validate
    if: github.event_name == 'pull_request' && github.repository == 'MontrealAI/AGI-Alpha-Agent-v0' && github.event.pull_request.head.repo.full_name == 'MontrealAI/AGI-Alpha-Agent-v0' && github.event.pull_request.head.ref == 'docs/try-work-evidence-pilot-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: work-evidence-kit-${{ github.event.pull_request.head.sha }}
          path: study-dist
      - name: Require exact-head standard checks and verify draft assets before visibility
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_HEAD: ${{ github.event.pull_request.head.sha }}
          STUDY_PR: ${{ github.event.pull_request.number }}
          STUDY_DIST: study-dist
        run: python studies/computer-use/2026-10-14/publish_preview.py
