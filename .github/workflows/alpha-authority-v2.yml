# SPDX-License-Identifier: Apache-2.0
name: Alpha creator authority v2 candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/alpha-creator-authority-v2-20261016, codex/alpha-marker-direct-origination-20261016]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-authority-v2-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  ALPHA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OPENAI_AGENTS_DISABLE_TRACING: 'true'
jobs:
  offline-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize outside-checkout runner paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "ALPHA_NATIVE_STATE_DIRECTORY=$RUNNER_TEMP/alpha-authority-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "XDG_CONFIG_HOME=$RUNNER_TEMP/alpha-authority-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/config" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/alpha-authority-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/cache" \
            "XDG_DATA_HOME=$RUNNER_TEMP/alpha-authority-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install existing locked toolchains and create outside-checkout evidence
        run: |
          set -euo pipefail
          node -e "const s=require('./tests/contracts/scripts/authority-revision').reviewedRevision(); if(s.commit!==process.env.ALPHA_EXPECTED_HEAD_SHA) throw Error('Exact reviewed head required');"
          echo '070e3c6652f4939fabe14788a0c80b38ed3d6e2ad792cebad4a5bbf842308667  tests/contracts/package-lock.json' | sha256sum --check
          npm ci --prefix tests/contracts
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip check
          python -c "from importlib.metadata import version; assert version('eth-hash') == '0.8.0'"
          node tests/contracts/authority-test/native-ci-evidence.cjs init
      - name: Run every check with isolated bounded native profile processes
        working-directory: tests/contracts
        run: |
          set -euo pipefail
          # All raw logs are private runner scratch. Public artifacts contain safe summaries and hashes only.
          run_check() {
            local label="$1"; shift
            set +e
            "$@" > "$ALPHA_NATIVE_STATE_DIRECTORY/logs/$label.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$ALPHA_NATIVE_STATE_DIRECTORY/logs/$label.exit-code"
            echo "$label exit=$code"
            return "$code"
          }
          run_check audit npm audit --audit-level=moderate --json
          run_check compile npm run compile:strict
          run_check historical node scripts/mainnet-record.js check
          run_check regressions node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile
          run_check policy node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/mainnet-authority.test.js --grep '^(?!.*coordinates all seven).*'
          run_check empty-session node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/mainnet-authority.test.js --grep 'coordinates all seven empty-eoa-direct-create.v1'
          run_check delegated-session node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/mainnet-authority.test.js --grep 'coordinates all seven delegated-eoa-direct-create.v1'
          run_check io-relay node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/authority-io.test.js authority-test/authority-session-relay.test.js
          run_check origination env ALPHA_DISPOSABLE_TRACE_OUTPUT="$ALPHA_NATIVE_STATE_DIRECTORY/public/direct-origination-traces.json" node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/authority-origination.test.js
          run_check creator-unit node --max-old-space-size=384 --test authority-test/creator-terminal.test.cjs authority-test/ephemeral-key.test.cjs authority-test/creator-native-contract.test.cjs
          run_check creator-pty python authority-test/creator-pty.test.py "$(command -v node)"
          run_check creator-local env ALPHA_CREATOR_TEST_OUTPUT="$ALPHA_NATIVE_STATE_DIRECTORY/creator-local-private" node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/creator-local.test.js
          run_check native-contract node --max-old-space-size=384 --test authority-test/native-ci-contract.test.cjs authority-test/authority-revision.test.cjs authority-test/authority-input-boundary.test.cjs
          # Each native profile has its own complete standalone checkout, dependencies,
          # local EVM, private directory and ephemeral HTTPS port. Their source-negative
          # fixtures must never run concurrently in the same checkout.
          native_profile() (
            set -euo pipefail
            local profile="$1"
            local profile_root="$RUNNER_TEMP/alpha-native-source-$profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            local profile_state="$RUNNER_TEMP/alpha-native-tools-$profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            git clone --no-hardlinks --no-checkout -- "$GITHUB_WORKSPACE" "$profile_root"
            git -C "$profile_root" checkout --detach "$ALPHA_EXPECTED_HEAD_SHA"
            export XDG_CONFIG_HOME="$profile_state/config" XDG_CACHE_HOME="$profile_state/cache" XDG_DATA_HOME="$profile_state/data"
            export npm_config_cache="$profile_state/npm-cache"
            cd "$profile_root/tests/contracts"
            npm ci
            npm run compile:strict
            if [ "$profile" = creator ]; then
              env HARDHAT_CONFIG=hardhat.authority.config.js ALPHA_CREATOR_NATIVE_OUTPUT="$ALPHA_NATIVE_STATE_DIRECTORY/public/native-creator" node --max-old-space-size=384 authority-test/creator-clean-checkout.cjs
            else
              env HARDHAT_CONFIG=hardhat.authority.config.js ALPHA_NATIVE_PROFILE="$profile" ALPHA_NATIVE_EVIDENCE_DIRECTORY="$ALPHA_NATIVE_STATE_DIRECTORY/public/native-$profile" node --max-old-space-size=384 authority-test/clean-checkout-cli.cjs
            fi
          )
          native_pids=()
          for profile in empty delegated marker creator; do
            run_check "native-$profile" native_profile "$profile" &
            native_pids+=("$!")
          done
          native_failed=0
          for native_pid in "${native_pids[@]}"; do
            if wait "$native_pid"; then :; else native_failed=1; fi
          done
          test "$native_failed" -eq 0
      - name: Derive exact-head evidence without rewriting historical source records
        if: always()
        run: node tests/contracts/authority-test/native-ci-evidence.cjs finish
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: alpha-authority-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ALPHA_NATIVE_STATE_DIRECTORY }}/public/
          if-no-files-found: error
          retention-days: 30
  conventional-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      HARDHAT_DISABLE_TELEMETRY_PROMPT: 'true'
    steps:
      - name: Initialize isolated conventional paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "ALPHA_CONVENTIONAL_STATE_DIRECTORY=$RUNNER_TEMP/alpha-conventional-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "XDG_CONFIG_HOME=$RUNNER_TEMP/alpha-conventional-xdg/config" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/alpha-conventional-xdg/cache" \
            "XDG_DATA_HOME=$RUNNER_TEMP/alpha-conventional-xdg/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Install exact locked toolchain and bind source
        run: |
          set -euo pipefail
          node tests/contracts/authority-test/conventional-ci-evidence.cjs init
          echo '070e3c6652f4939fabe14788a0c80b38ed3d6e2ad792cebad4a5bbf842308667  tests/contracts/package-lock.json' | sha256sum --check
          npm ci --prefix tests/contracts
      - name: Compile and exercise conventional empty and marker creators
        working-directory: tests/contracts
        run: |
          set -euo pipefail
          run_check() {
            local label="$1"; shift
            set +e
            "$@" > "$ALPHA_CONVENTIONAL_STATE_DIRECTORY/logs/$label.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$ALPHA_CONVENTIONAL_STATE_DIRECTORY/logs/$label.exit"
            echo "$label exit=$code"
            return "$code"
          }
          run_check compile timeout -k 5s 600s npm run compile:strict
          run_check unit timeout -k 5s 120s node --max-old-space-size=1024 --test authority-test/conventional-creator.test.cjs authority-test/conventional-ci.test.cjs authority-test/creator-terminal.test.cjs authority-test/ephemeral-key.test.cjs
          run_check local env ALPHA_CONVENTIONAL_TEST_OUTPUT="$ALPHA_CONVENTIONAL_STATE_DIRECTORY/campaign" timeout -k 5s 300s node --max-old-space-size=1024 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/conventional-creator-local.test.js
      - name: Verify exact-head conventional evidence
        if: always()
        run: node tests/contracts/authority-test/conventional-ci-evidence.cjs finish
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: alpha-conventional-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ALPHA_CONVENTIONAL_STATE_DIRECTORY }}/public/
          if-no-files-found: error
          retention-days: 30
