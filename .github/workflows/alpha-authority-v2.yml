# SPDX-License-Identifier: Apache-2.0
name: Alpha creator authority v2 candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/alpha-creator-authority-v2-20261016]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-authority-v2-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  ALPHA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OPENAI_AGENTS_DISABLE_TRACING: 'true'
jobs:
  offline-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize outside-checkout runner paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "ALPHA_NATIVE_STATE_DIRECTORY=$RUNNER_TEMP/alpha-authority-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "XDG_CONFIG_HOME=$RUNNER_TEMP/alpha-authority-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/config" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/alpha-authority-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/cache" \
            "XDG_DATA_HOME=$RUNNER_TEMP/alpha-authority-xdg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install existing locked toolchains and create outside-checkout evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ALPHA_EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo '070e3c6652f4939fabe14788a0c80b38ed3d6e2ad792cebad4a5bbf842308667  tests/contracts/package-lock.json' | sha256sum --check
          npm ci --prefix tests/contracts
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip check
          python -c "from importlib.metadata import version; assert version('eth-hash') == '0.8.0'"
          node tests/contracts/authority-test/native-ci-evidence.cjs init
      - name: Run all checks serially with a fresh bounded test process
        working-directory: tests/contracts
        run: |
          set -euo pipefail
          # All raw logs are private runner scratch. Public artifacts contain safe summaries and hashes only.
          run_check() {
            local label="$1"; shift
            set +e
            "$@" > "$ALPHA_NATIVE_STATE_DIRECTORY/logs/$label.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$ALPHA_NATIVE_STATE_DIRECTORY/logs/$label.exit-code"
            echo "$label exit=$code"
            return "$code"
          }
          run_check audit npm audit --audit-level=moderate --json
          run_check compile npm run compile:strict
          run_check historical node scripts/mainnet-record.js check
          run_check regressions node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile
          run_check policy node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/mainnet-authority.test.js --grep '^(?!.*coordinates all seven).*'
          run_check empty-session node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/mainnet-authority.test.js --grep 'coordinates all seven empty-eoa-direct-create.v1'
          run_check delegated-session node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/mainnet-authority.test.js --grep 'coordinates all seven delegated-eoa-direct-create.v1'
          run_check io-relay node --max-old-space-size=384 node_modules/hardhat/internal/cli/cli.js test --no-compile --config hardhat.authority.config.js authority-test/authority-io.test.js authority-test/authority-session-relay.test.js
          run_check native-contract node --max-old-space-size=384 --test authority-test/native-ci-contract.test.cjs
          run_check native-empty env HARDHAT_CONFIG=hardhat.authority.config.js ALPHA_NATIVE_PROFILE=empty ALPHA_NATIVE_EVIDENCE_DIRECTORY="$ALPHA_NATIVE_STATE_DIRECTORY/public/native-empty" node --max-old-space-size=384 authority-test/clean-checkout-cli.cjs
          run_check native-delegated env HARDHAT_CONFIG=hardhat.authority.config.js ALPHA_NATIVE_PROFILE=delegated ALPHA_NATIVE_EVIDENCE_DIRECTORY="$ALPHA_NATIVE_STATE_DIRECTORY/public/native-delegated" node --max-old-space-size=384 authority-test/clean-checkout-cli.cjs
      - name: Derive exact-head evidence without rewriting historical source records
        if: always()
        run: node tests/contracts/authority-test/native-ci-evidence.cjs finish
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: alpha-authority-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ALPHA_NATIVE_STATE_DIRECTORY }}/public/
          if-no-files-found: error
          retention-days: 30
