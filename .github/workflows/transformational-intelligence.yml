name: Transformational Intelligence acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ti-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bounded-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Install existing locked runtime and browser tools
        run: |
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip install --require-hashes -r examples/successor-workbench/computer/requirements.lock
          python -m pip install pytest==8.4.1
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Reproduce exact paper artifact and preserve publication bytes
        run: |
          mkdir -p evidence
          python -m unittest tests.test_transformational_paper -v
          python scripts/reproduce_transformational_paper.py --out evidence/paper
      - name: Exercise durable discovery and separately controlled measurement
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest --noconftest -o addopts= tests/runtime/test_transformation.py tests/runtime/test_transformation_review.py tests/runtime/test_transformation_library.py tests/runtime/test_measurement.py tests/runtime/test_measurement_review.py -q --junitxml=evidence/discovery.xml
          python -m alpha_factory_v1.core.runtime.cli --home "$RUNNER_TEMP/ti-local-agent" successor-transform demo --output evidence/native-campaign.json
          TI_NATIVE_CAMPAIGN=evidence/native-campaign.json node --test examples/transformational-intelligence/inspector.test.mjs
      - name: Verify generated sources and complete offline browser journey
        run: |
          python scripts/generate_transformational_intelligence.py
          python scripts/generate_successor_alpha.py
          git diff --exit-code -- docs/transformational-intelligence docs/successor/alpha
          node --test tests/browser/transformational_intelligence.test.mjs
          python tests/browser/test_transformational_intelligence_browser.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: transformational-intelligence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
