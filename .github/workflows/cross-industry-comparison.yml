# SPDX-License-Identifier: Apache-2.0
name: Cross-industry comparison acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'alpha_factory_v1/demos/cross_industry_alpha_factory/**'
      - 'docs/cross_industry_alpha_factory/**'
      - 'docs/alpha_factory_v1/demos/cross_industry_alpha_factory/**'
      - 'tests/browser/test_cross_industry*'
      - 'tests/test_cross*.py'
      - 'alpha_factory_v1/tests/test_queue_cross_alpha.py'
      - 'alpha_factory_v1/tests/test_cross_industry_alpha.py'
      - 'requirements-agent.lock'
      - 'scripts/generate_gallery_html.py'
      - 'scripts/generate_decision_studio.py'
      - '.github/workflows/cross-industry-comparison.yml'
  push:
    branches: [main]
    paths:
      - 'alpha_factory_v1/demos/cross_industry_alpha_factory/**'
      - 'docs/cross_industry_alpha_factory/**'
      - 'docs/alpha_factory_v1/demos/cross_industry_alpha_factory/**'
      - 'tests/browser/test_cross_industry*'
      - 'tests/test_cross*.py'
      - 'alpha_factory_v1/tests/test_queue_cross_alpha.py'
      - 'alpha_factory_v1/tests/test_cross_industry_alpha.py'
      - 'requirements-agent.lock'
      - 'scripts/generate_gallery_html.py'
      - 'scripts/generate_decision_studio.py'
      - '.github/workflows/cross-industry-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-industry-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Install pinned browser and accessibility auditor
        run: |
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip install playwright==1.54.0 pytest==8.4.1
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Check strict comparison and independent Python parity
        run: |
          node --test tests/browser/test_cross_industry_engine.mjs
          # Legacy unittest modules need no fixtures; their package explicitly imports this full-suite plugin.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -c /dev/null --noconftest -p no:tests.conftest -p no:cacheprovider tests/test_cross_industry_notebook.py tests/test_cross_industry_comparison.py tests/test_cross_alpha_discovery.py tests/test_cross_industry_bridge_runtime.py alpha_factory_v1/tests/test_queue_cross_alpha.py alpha_factory_v1/tests/test_cross_industry_alpha.py
      - name: Exercise original bilingual comparison and evidence lifecycle
        env:
          AXE_SCRIPT: tests/browser/node_modules/axe-core/axe.min.js
        run: |
          python tests/browser/test_cross_industry_browser.py
          CROSS_ROUTE=alpha_factory_v1/demos/cross_industry_alpha_factory/ python tests/browser/test_cross_industry_browser.py
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cross-industry-browser
          path: evidence/cross-industry-browser/
          if-no-files-found: error
