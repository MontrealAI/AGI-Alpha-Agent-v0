# SPDX-License-Identifier: Apache-2.0
name: Paper site publication
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The full release publishes only AFTER its Pages job has completed. A paper
  # upload which arrived during acceptance is retried against latest main here.
  workflow_run:
    workflows: [Agent release acceptance]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: paper-publication-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'MontrealAI/AGI-Alpha-Agent-v0' &&
      ((github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.name == 'Agent release acceptance' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch' ||
         github.event.workflow_run.event == 'workflow_call')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      head: ${{ steps.prepare.outputs.head }}
      plan-name: ${{ steps.names.outputs.plan }}
      pages-name: ${{ steps.names.outputs.pages }}
    steps:
      # Only the trusted default branch is executed. Never use workflow_run's
      # artifact contents, head checkout, PR branch, repository or credentials.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install the hash-locked passive PDF parser
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-papers.lock
      - name: Restore PUBLIC software and prove the strict paper-only overlay
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.publish_paper_site prepare
      - name: Name this successful producer's exact artifacts
        id: names
        if: steps.prepare.outputs.ready == 'true'
        run: |
          echo "plan=paper-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "pages=paper-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        if: steps.prepare.outputs.ready == 'true'
        with:
          node-version: '22.17.1'
      - name: Install the homepage validation dependencies
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Validate homepage and paper links, not full software acceptance
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python -m scripts.validate_homepage --site paper-site --output evidence/paper-homepage
          python -m scripts.publish_paper_site seal
      - name: Upload the composed site without holding the Pages lock
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: ${{ steps.names.outputs.pages }}
          path: paper-site
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: paper-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            paper-state/
            evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: ${{ steps.names.outputs.plan }}
          path: paper-state/plan.json
          if-no-files-found: error

  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.plan-name }}
          path: paper-state
          digest-mismatch: error
      - name: Recheck main, PUBLIC baseline and monotonic live identity after lock
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.publish_paper_site guard
      - name: Deploy only the verified overlay, never release software
        id: deployment
        if: steps.guard.outputs.ready == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.prepare.outputs.pages-name }}

  verify-public:
    needs: [prepare, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.plan-name }}
          path: paper-state
          digest-mismatch: error
      - name: Verify public paper bytes without holding the Pages lock
        run: python -m scripts.publish_paper_site verify-live
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: paper-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
