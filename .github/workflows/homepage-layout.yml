# SPDX-License-Identifier: Apache-2.0
name: Homepage visual acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/assets/portal/**'
      - 'docs/assets/ascension/home.css'
      - 'docs/assets/insight/home.css'
      - 'docs/assets/bloom/home.css'
      - 'scripts/templates/portal.html'
      - 'scripts/validate_homepage.py'
      - 'scripts/homepage_evidence.py'
      - '.github/workflows/homepage-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - name: Install pinned browser and accessibility auditor
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Check rendered text, bilingual navigation and accessibility
        run: python -m scripts.validate_homepage --output evidence/homepage
      - name: Retain viewport screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: homepage-visual-acceptance
          path: evidence/homepage/
          if-no-files-found: error
