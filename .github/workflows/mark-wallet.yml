# SPDX-License-Identifier: Apache-2.0
name: MARK wallet acceptance
on:
  pull_request:
    paths:
      - 'docs/assets/ascension-wallet/**'
      - 'docs/assets/nova-studio/**'
      - 'docs/ascension/mainnet/**'
      - 'tests/nova-studio/**'
      - 'tests/contracts/scripts/nova-studio.js'
      - 'tests/contracts/scripts/ascension-cycle.js'
      - 'alpha_factory_v1/core/runtime/successor/**'
      - 'alpha_factory_v1/core/runtime/api.py'
      - 'alpha_factory_v1/core/runtime/web/ascension-studio*'
      - 'tests/runtime/test_successor_studio*.py'
      - 'docs/ascension-protocol/**'
      - 'scripts/build_mark_wallet.py'
      - 'scripts/build_service_worker.py'
      - 'scripts/validate_mark_wallet.py'
      - 'scripts/mark_wallet_evidence.py'
      - 'scripts/mkdocs_assets.py'
      - 'tests/mark-wallet/**'
      - 'deployments/ethereum-mainnet/2026-10-11/**'
      - '.github/workflows/mark-wallet.yml'
  push:
    branches: [main, feat/mark-mainnet-wallet-20261013, feat/nova-seed-mainnet-studio-20261014]
    paths:
      - 'docs/assets/ascension-wallet/**'
      - 'docs/assets/nova-studio/**'
      - 'docs/ascension/mainnet/**'
      - 'tests/nova-studio/**'
      - 'tests/contracts/scripts/nova-studio.js'
      - 'tests/contracts/scripts/ascension-cycle.js'
      - 'alpha_factory_v1/core/runtime/successor/**'
      - 'alpha_factory_v1/core/runtime/api.py'
      - 'alpha_factory_v1/core/runtime/web/ascension-studio*'
      - 'tests/runtime/test_successor_studio*.py'
      - 'docs/ascension-protocol/**'
      - 'scripts/build_mark_wallet.py'
      - 'scripts/build_service_worker.py'
      - 'scripts/validate_mark_wallet.py'
      - 'scripts/mark_wallet_evidence.py'
      - 'scripts/mkdocs_assets.py'
      - 'tests/mark-wallet/**'
      - 'deployments/ethereum-mainnet/2026-10-11/**'
      - '.github/workflows/mark-wallet.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Check dependency-free wallet and profile tests
        run: |
          node --test tests/mark-wallet/core.test.mjs tests/mark-wallet/recovery.test.mjs
          python -m unittest discover -s tests/mark-wallet -p "test_*.py" -v
      - name: Install existing locked contract reference tools
        run: npm ci --prefix tests/contracts
      - name: Validate the unchanged archived deployment record
        run: npm run mainnet:record-check --prefix tests/contracts
      - name: Build exact archived wallet profile
        run: python -m scripts.build_mark_wallet
      - name: Differential ABI and archive conformance
        run: node --test tests/mark-wallet/abi.test.mjs
      - name: Ensure historical source, archive and local evidence were not rewritten
        run: git diff --exit-code -- contracts tests/contracts/contracts deployments docs/assets/ascension-protocol/receipt.json
      - name: Install rendered wallet acceptance tools
        run: |
          python -m pip install --require-hashes -r requirements-agent.lock
          python -m pip install 'eth-hash[pycryptodome]==0.8.0' eth-abi==6.0.0 pytest==8.4.1
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts
      - name: Exercise real browser with synthetic injected wallet
        run: python -m scripts.validate_mark_wallet --output evidence/mark-wallet
      - name: Nova-Seed compiler, encryption, cycle trust and rights checks
        run: node --test tests/nova-studio/*.test.mjs
      - name: Bounded native bridge, authority and operator checks
        env:
          PYTHONPATH: '.'
          NO_DISCLAIMER: '1'
        run: >-
          python -m pytest --confcutdir=tests/runtime
          tests/runtime/test_successor_studio.py tests/runtime/test_successor_studio_operator.py
          tests/runtime/test_successor_studio_operator_browser.py -q
      - name: Nova-Seed exact-source lifecycle and browser recovery
        working-directory: tests/contracts
        env:
          NOVA_BROWSER: '1'
        run: npx --no-install hardhat run scripts/nova-studio.js
      - name: Complete two-cycle browser workflow and genuine bounded execution
        working-directory: tests/contracts
        env:
          ASCENSION_CYCLE_BROWSER: '1'
          ALPHA_PYTHON: python
        run: npx --no-install hardhat run scripts/ascension-cycle.js
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: ascension-complete-cycle-acceptance
          path: evidence/ascension-cycle/
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: nova-studio-acceptance
          path: evidence/nova-studio/
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: mark-wallet-browser
          path: evidence/mark-wallet/
          if-no-files-found: error
