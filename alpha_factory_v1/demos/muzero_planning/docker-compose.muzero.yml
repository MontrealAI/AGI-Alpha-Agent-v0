services:
  orchestrator:
    build:
      context: ../../..
      dockerfile: alpha_factory_v1/demos/muzero_planning/Dockerfile
    image: alpha_factory_muzero:2.0.0
    user: "1001:1001"
    init: true
    command: ["python", "-m", "alpha_factory_v1.demos.muzero_planning", "--host", "0.0.0.0", "--port", "7861"]
    environment:
      GRADIO_ANALYTICS_ENABLED: "False"
      MUZERO_ENV_ID: "${MUZERO_ENV_ID:-MiniChoice-v0}"
      MUZERO_EPISODES: "${MUZERO_EPISODES:-32}"
      HOME: /tmp
      GRADIO_TEMP_DIR: /tmp/gradio
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "127.0.0.1:${HOST_PORT:-7861}:7861"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/__live', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3
