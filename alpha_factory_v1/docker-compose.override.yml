###############################################################################
#  docker-compose.override.yml -- Development conveniences (hot reload)       #
#  Compose v2+ file (no explicit `version:` key required)                      #
###############################################################################

x-restart: &restart_policy
  restart: unless-stopped

x-healthcheck: &default_healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

services:

  ###########################################################################
  # 1️⃣  FastAPI back‑end – auto‑reload on source edits                      #
  ###########################################################################
  orchestrator:
    <<: *restart_policy
    container_name: orchestrator-dev
    # Re-use the multi-stage Dockerfile but build only the *runtime* stage
    build:
      context: ..
      dockerfile: alpha_factory_v1/Dockerfile
      target: runtime                # Stage 1 in the Dockerfile
      args:
        BASE_IMAGE: python:3.11-slim-bookworm   # fast CPU build for dev
    image: alphafactory-dev:latest
    command: >
      uvicorn alpha_factory_v1.backend:app
      --reload
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Hot‑reload Python + UI templates
      - ./backend:/app/alpha_factory_v1/backend
      - ./ui:/app/alpha_factory_v1/ui
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      # Persist logs so pytest smoke‑tests behave like prod
      - /tmp/alphafactory:/tmp/alphafactory
    environment:
      ALPHA_MARKET_PROVIDER: ${ALPHA_MARKET_PROVIDER:-sim}
      ALPHA_BROKER:         ${ALPHA_BROKER:-sim}
      PYTHONUNBUFFERED: "1"
    healthcheck:
      <<: *default_healthcheck
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer $$API_TOKEN\" http://localhost:8000/api/logs"]
    depends_on:
      - redis
    networks: [af-net]

  ###########################################################################
  # 2️⃣  Trace‑graph UI – Vite dev server with HMR                           #
  ###########################################################################
  ui:
    <<: *restart_policy
    container_name: alphafactory-ui-dev
    image: node:22.17.1-bookworm-slim
    working_dir: /ui/alpha_factory_v1/core/interface/web_client
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./core/interface/web_client:/ui/alpha_factory_v1/core/interface/web_client
      - ./core/telemetry.js:/ui/alpha_factory_v1/core/telemetry.js:ro
      - ui-node-modules:/ui/alpha_factory_v1/core/interface/web_client/node_modules
    environment:
      # Vite proxies API requests during dev
      VITE_API_BASE: http://localhost:8000
      CYPRESS_INSTALL_BINARY: "0"
    healthcheck:
      <<: *default_healthcheck
      start_period: 180s
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    networks: [af-net]

  ###########################################################################
  # 3️⃣  (Optional) Redis – future task‑queue / pub‑sub backbone            #
  ###########################################################################
  redis:
    <<: *restart_policy
    container_name: alphafactory-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *default_healthcheck
      test: ["CMD", "redis-cli", "ping"]
    networks: [af-net]

# ------------------------------------------------------------------------- #
# Shared development network & named volume                                 #
# ------------------------------------------------------------------------- #
networks:
  af-net:
    driver: bridge

volumes:
  redis-data:
  ui-node-modules:
