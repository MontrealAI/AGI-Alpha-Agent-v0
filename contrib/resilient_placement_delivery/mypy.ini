[mypy]
python_version = 3.12
strict = True
follow_imports = skip
ignore_missing_imports = True
explicit_package_bases = True

[mypy-pydantic.*]
follow_imports = normal

[mypy-alpha_factory_v1.core.runtime.successor.flywheel_experiments]
follow_imports = silent

[mypy-alpha_factory_v1.core.runtime.successor.protocol]
follow_imports = silent
