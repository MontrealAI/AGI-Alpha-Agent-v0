<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Alpha · Upgrade decision</title><link rel="stylesheet" href="/strategy.css"></head>
<body><main><nav><strong>AGI ALPHA</strong><button id="language" type="button">Français</button></nav>
<p class="eyebrow" data-en="DEPENDENCY UPGRADE · BOUNDED REVIEW" data-fr="MISE À NIVEAU · EXAMEN BORNÉ"></p>
<h1 data-en="Review this update with evidence." data-fr="Examinez cette mise à niveau avec ses preuves."></h1>
<p data-en="Choose a captured public dependency change. Receive a specific next action, the checks performed, source evidence, unresolved issues and a downloadable English/French packet." data-fr="Choisissez une modification de dépendance publique capturée. Recevez une prochaine action précise, les vérifications réalisées, les sources, les limites et un dossier anglais/français téléchargeable."></p>
<p class="notice" data-en="Candidate profile: operational adoption NOT APPROVED. This interface requires an owner-approved local executor. It does not certify source behavior, execute inspected code or prove self-acceleration." data-fr="Profil candidat : adoption opérationnelle NON APPROUVÉE. Cette interface exige un exécuteur local approuvé par son responsable. Elle ne certifie pas le comportement du code, n'exécute pas le code inspecté et ne prouve aucune auto-accélération."></p>
<section><h2 data-en="1 · Choose the change to review" data-fr="1 · Choisir la modification à examiner"></h2><label for="case" data-en="Captured public dependency change" data-fr="Modification de dépendance publique capturée"></label><select id="case" aria-label="Public dependency change"></select><p data-en="Historical examples are labelled. A source-contract check does not authorize an upgrade or establish full compatibility." data-fr="Les exemples historiques sont identifiés. L'examen des contrats n'autorise pas de mise à niveau et n'établit pas la compatibilité complète."></p></section><section><h2 data-en="2 · Connect the existing executor" data-fr="2 · Connecter l'exécuteur existant"></h2><label for="token" data-en="Existing operator token" data-fr="Jeton existant de l'opérateur"></label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect" data-en="Connect" data-fr="Connecter"></button><button id="disconnect" data-en="Disconnect" data-fr="Déconnecter"></button></section>
<section><h2 data-en="3 · Review and approve the check" data-fr="3 · Examiner et approuver l'analyse"></h2><details><summary data-en="Prepared input details" data-fr="Détails de l’entrée préparée"></summary><label for="input" data-en="Optional: import an owner-prepared upgrade selection" data-fr="Facultatif : importer une sélection préparée par le responsable"></label><input id="file" type="file" accept="application/json,.json"><textarea id="input" rows="9" spellcheck="false" aria-label="Prepared source input JSON"></textarea><label for="request-id" data-en="Unique request ID" data-fr="Identifiant unique de la demande"></label><input id="request-id" maxlength="64" spellcheck="false"></details><button id="prepare" data-en="Prepare exact plan" data-fr="Préparer le plan exact"></button><pre id="plan-summary" aria-live="polite"></pre><details><summary data-en="Exact technical plan" data-fr="Plan technique exact"></summary><pre id="plan"></pre></details><button id="approve" data-en="Approve this exact finite plan" data-fr="Approuver ce plan fini exact"></button></section>
<section><h2 data-en="4 · Receive your decision packet" data-fr="4 · Recevoir votre dossier de décision"></h2><button id="cancel" data-en="Cancel mission" data-fr="Annuler la mission" disabled>Cancel mission</button><button id="run" data-en="Run approved mission" data-fr="Exécuter la mission approuvée"></button><button id="refresh" data-en="Refresh durable history" data-fr="Actualiser l'historique durable"></button><button id="pause" data-en="Pause" data-fr="Suspendre"></button><button id="resume" data-en="Ready for new approved work" data-fr="Prêt pour un nouveau travail approuvé"></button><button id="stop" class="danger" data-en="Permanent STOP" data-fr="ARRÊT permanent"></button><p data-en="Browser disconnection during active source work is not yet qualified. Keep the local executor process running and reconnect to inspect durable history. Recovery is disabled by default. An explicitly configured source attempt allowance can restore eligible checkpoints within the original approval; corrupt, cancelled, stopped, exhausted or expired work remains fenced for inspection. Expiry and budgets never renew silently." data-fr="La déconnexion du navigateur pendant un travail source actif n'est pas encore qualifiée. Gardez le processus de l'exécuteur local actif et reconnectez-vous pour examiner l'historique durable. La reprise est désactivée par défaut. Une limite de tentatives source explicitement configurée peut restaurer les points de contrôle admissibles dans l’autorisation initiale ; les missions corrompues, annulées, arrêtées, épuisées ou expirées exigent une inspection. Les limites et l'expiration ne se renouvellent jamais en silence."></p><p id="executor-state"></p><div id="history"></div><pre id="status" role="status" aria-live="polite"></pre></section>
<footer data-en="Provider cost, customer effort, price and surplus remain separate and unmeasured here. No payment or token transaction. One mission may contain many artifacts and checks." data-fr="Le coût du fournisseur, l'effort du client, le prix et le surplus restent distincts et non mesurés ici. Aucune transaction financière ou de jeton. Une mission peut contenir plusieurs fichiers et vérifications."></footer>
