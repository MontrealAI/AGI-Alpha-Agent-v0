<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Alpha · Source assurance candidate</title><link rel="stylesheet" href="/strategy.css"></head>
<body><main><nav><strong>AGI ALPHA</strong><button id="language" type="button">Français</button></nav>
<p class="eyebrow" data-en="SOURCE ASSURANCE · ENGINEERING CANDIDATE" data-fr="ASSURANCE DU CODE SOURCE · CANDIDAT TECHNIQUE"></p>
<h1 data-en="Know exactly what changed." data-fr="Sachez exactement ce qui a changé."></h1>
<p data-en="Compare an explicitly permitted public Git inventory with an exact local commit. Receive complete inventories, differences, follow-up CSVs and a portable report." data-fr="Comparez un inventaire Git public explicitement autorisé à une révision locale exacte. Recevez les inventaires, les écarts, les actions CSV et un rapport portable."></p>
<p class="notice" data-en="Candidate profile: operational adoption NOT APPROVED. This interface requires an owner-approved local executor. It does not certify source behavior, execute inspected code or prove self-acceleration." data-fr="Profil candidat : adoption opérationnelle NON APPROUVÉE. Cette interface exige un exécuteur local approuvé par son responsable. Elle ne certifie pas le comportement du code, n'exécute pas le code inspecté et ne prouve aucune auto-accélération."></p>
<section><h2 data-en="1 · Connect the existing executor" data-fr="1 · Connecter l'exécuteur existant"></h2><label for="token" data-en="Existing operator token" data-fr="Jeton existant de l'opérateur"></label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect" data-en="Connect" data-fr="Connecter"></button><button id="disconnect" data-en="Disconnect" data-fr="Déconnecter"></button></section>
<section><h2 data-en="2 · Review the permitted mission" data-fr="2 · Examiner la mission autorisée"></h2><label for="input" data-en="Import the owner-prepared source input JSON" data-fr="Importer l'entrée JSON préparée par le responsable"></label><input id="file" type="file" accept="application/json,.json"><textarea id="input" rows="9" spellcheck="false" aria-label="Prepared source input JSON"></textarea><label for="request-id" data-en="Unique request ID" data-fr="Identifiant unique de la demande"></label><input id="request-id" maxlength="64" spellcheck="false"><button id="prepare" data-en="Prepare exact plan" data-fr="Préparer le plan exact"></button><pre id="plan-summary" aria-live="polite"></pre><details><summary data-en="Exact technical plan" data-fr="Plan technique exact"></summary><pre id="plan"></pre></details><button id="approve" data-en="Approve this exact finite plan" data-fr="Approuver ce plan fini exact"></button></section>
<section><h2 data-en="3 · Execute and receive the result" data-fr="3 · Exécuter et recevoir le résultat"></h2><button id="cancel" data-en="Cancel mission" data-fr="Annuler la mission" disabled>Cancel mission</button><button id="run" data-en="Run approved mission" data-fr="Exécuter la mission approuvée"></button><button id="refresh" data-en="Refresh durable history" data-fr="Actualiser l'historique durable"></button><button id="pause" data-en="Pause" data-fr="Suspendre"></button><button id="resume" data-en="Ready for new approved work" data-fr="Prêt pour un nouveau travail approuvé"></button><button id="stop" class="danger" data-en="Permanent STOP" data-fr="ARRÊT permanent"></button><p data-en="Browser disconnection during active source work is not yet qualified. Keep the local executor process running and reconnect to inspect durable history. Recovery is disabled by default. An explicitly configured source attempt allowance can restore eligible checkpoints within the original approval; corrupt, cancelled, stopped, exhausted or expired work remains fenced for inspection. Expiry and budgets never renew silently." data-fr="La déconnexion du navigateur pendant un travail source actif n'est pas encore qualifiée. Gardez le processus de l'exécuteur local actif et reconnectez-vous pour examiner l'historique durable. La reprise est désactivée par défaut. Une limite de tentatives source explicitement configurée peut restaurer les points de contrôle admissibles dans l’autorisation initiale ; les missions corrompues, annulées, arrêtées, épuisées ou expirées exigent une inspection. Les limites et l'expiration ne se renouvellent jamais en silence."></p><p id="executor-state"></p><div id="history"></div><pre id="status" role="status" aria-live="polite"></pre></section>
<footer data-en="Provider cost, customer effort, price and surplus remain separate and unmeasured here. No payment or token transaction. One mission may contain many artifacts and checks." data-fr="Le coût du fournisseur, l'effort du client, le prix et le surplus restent distincts et non mesurés ici. Aucune transaction financière ou de jeton. Une mission peut contenir plusieurs fichiers et vérifications."></footer>
</main><script type="module" src="/strategy.js"></script></body></html>
